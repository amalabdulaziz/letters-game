<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الحروف - النسخة الواضحة 🏆</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, runTransaction } from "https://www.gstatic.com/firebasejs/9.1.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRerGp0Wfj7QoxzMNYnWX0zmtg1NAEBls",
            databaseURL: "https://letters-game-ff80c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "letters-game-ff80c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameRef = ref(db, 'letterGame');

        let myRole = "", audioCtx = null, timerInterval = null, currentLetter = "", baseTime = 15;
        const categories = ["حيوان","جماد","بلاد","أكلة","مهنة","نبات","جماد"];

        // دالة تشغيل الصوت - محسنة جداً للآيباد
        window.playSound = (freq, type = 'sine', duration = 0.2) => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type; o.connect(g); g.connect(audioCtx.destination);
                o.frequency.value = freq; o.start();
                g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                o.stop(audioCtx.currentTime + duration);
            } catch(e) { console.log("Audio issue"); }
        };

        window.setupGame = (role, ai, time) => {
            window.playSound(600, 'triangle');
            myRole = role;
            baseTime = time;
            update(gameRef, { isAI: ai, status: 'picking', turn: 'p1', timer: baseTime, used: {}, level: time, p1S:0, p2S:0 });
            document.getElementById('setupLayer').style.display = 'none';
            listen();
        };

        window.pick = (l) => {
            window.playSound(800, 'square', 0.1); // صوت عند اختيار حرف
            update(gameRef, { 
                currentL: l, status: "answering", [`used/${l}`]: true, timer: baseTime,
                cat: categories[Math.floor(Math.random() * categories.length)]
            });
        };

        window.submitAns = () => {
            const input = document.getElementById('ansInput');
            const val = input.value.trim();
            if (val.startsWith(currentLetter) && val.length > 1) {
                window.playSound(1000, 'sine', 0.5); // صوت صح
                runTransaction(ref(db, `letterGame/${myRole}S`), (s) => (s || 0) + 1);
                update(gameRef, { turn: (myRole === 'p1' ? 'p2' : 'p1'), status: 'picking', timer: baseTime });
                input.value = "";
            } else {
                window.playSound(150, 'sawtooth', 0.3); // صوت خطأ
            }
        };

        function listen() {
            onValue(gameRef, (snap) => {
                const d = snap.val(); if(!d) return;
                currentLetter = d.currentL || "";
                baseTime = d.level || 15;
                document.getElementById('timer').innerText = d.timer;
                document.getElementById('p1S').innerText = d.p1S || 0;
                document.getElementById('p2S').innerText = d.p2S || 0;
                
                // تنبيه الـ 5 ثواني
                if (d.turn === myRole && d.status === 'answering' && d.timer <= 5 && d.timer > 0) {
                    window.playSound(1200, 'sine', 0.1);
                    document.getElementById('timer').style.color = 'red';
                } else {
                    document.getElementById('timer').style.color = 'black';
                }

                document.querySelectorAll('.letter').forEach(el => {
                    el.classList.toggle('used', !!(d.used && d.used[el.innerText]));
                });

                if(d.turn === myRole) {
                    document.getElementById('lock').style.display = 'none';
                    document.getElementById('ansInput').disabled = (d.status === 'picking');
                    document.getElementById('msg').innerText = d.status==='picking' ? "دورك: اختر حرفاً" : d.cat + " بحرف (" + currentLetter + ")";
                    if(d.status==='answering' && !timerInterval) startTimer();
                } else {
                    document.getElementById('lock').style.display = 'flex';
                    clearInterval(timerInterval); timerInterval = null;
                    if (d.isAI && d.turn === 'p2' && myRole === 'p1') {
                        setTimeout(() => {
                            if (d.status === 'picking') {
                                const avail = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split('').filter(l => !d.used || !d.used[l]);
                                if (avail.length > 0) pick(avail[Math.floor(Math.random()*avail.length)]);
                            } else {
                                update(gameRef, { p2S: (d.p2S||0)+1, turn: 'p1', status: 'picking', timer: baseTime });
                            }
                        }, 3000);
                    }
                }
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                runTransaction(ref(db, 'letterGame/timer'), (t) => (t > 0 ? t - 1 : 0));
            }, 1000);
        }

        window.forceReset = () => { if(confirm("تصفير؟")) remove(gameRef).then(() => location.reload()); };
    </script>

    <style>
        body { margin: 0; background: #f0f0f0; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        #setupLayer { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .mode-card { background: #eee; padding: 15px; border-radius: 15px; margin: 10px; width: 100%; max-width: 400px; border: 2px solid #ccc; }
        .btn { padding: 10px 20px; margin: 5px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        .btn-green { background: #2ecc71; color: white; }
        .btn-yellow { background: #f1c40f; color: black; }
        .btn-red { background: #e74c3c; color: white; }
        .score-bar { display: flex; justify-content: space-around; background: white; padding: 15px; border-bottom: 3px solid #333; font-size: 1.5rem; }
        .ans-container { display: flex; padding: 10px; gap: 5px; background: #ddd; }
        .ans-box { flex-grow: 1; padding: 15px; border-radius: 10px; border: 2px solid #333; font-size: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 10px; background: white; height: 50vh; }
        .letter { background: #f9f9f9; display: flex; align-items: center; justify-content: center; border: 1px solid #ccc; border-radius: 8px; font-size: 1.5rem; color: #333; font-weight: bold; }
        .used { opacity: 0.1; pointer-events: none; }
        #lock { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>
    <div id="setupLayer">
        <h1>🏁 سباق الحروف</h1>
        <div class="mode-card">
            <h3>👤 ضد الكمبيوتر</h3>
            <button class="btn btn-green" onclick="setupGame('p1', true, 20)">سهل</button>
            <button class="btn btn-yellow" onclick="setupGame('p1', true, 15)">متوسط</button>
            <button class="btn btn-red" onclick="setupGame('p1', true, 7)">صعب</button>
        </div>
        <div class="mode-card">
            <h3>👥 لاعب ضد لاعب (أونلاين)</h3>
            <button class="btn btn-green" onclick="setupGame('p1', false, 15)">لاعب 1</button>
            <button class="btn btn-green" onclick="setupGame('p2', false, 15)">لاعب 2</button>
        </div>
        <button class="btn" style="background:black; color:white; margin-top:20px;" onclick="forceReset()">🔄 تصفير السيرفر</button>
    </div>

    <div id="lock"><h1>⏳ دور الخصم...</h1></div>

    <div class="score-bar">
        <div>P1: <b id="p1S">0</b></div>
        <div id="timer" style="font-weight:bold; font-size: 2.5rem;">15</div>
        <div>P2: <b id="p2S">0</b></div>
    </div>

    <h2 id="msg" style="text-align:center; margin: 10px 0;">اختر حرفاً</h2>

    <div class="ans-container">
        <input type="text" id="ansInput" class="ans-box" placeholder="اكتب هنا..." disabled>
        <button class="btn btn-green" onclick="submitAns()">✅</button>
    </div>

    <div class="grid">
        <script>
            "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split('').forEach(l => {
                document.write(`<div class="letter" onclick="pick('${l}')">${l}</div>`);
            });
        </script>
    </div>
</body>
</html>
