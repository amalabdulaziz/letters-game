        function getCatWithEmoji(catName) {
            if(catName === "حيوان") return "حيوان 🦁";
            if(catName === "بلاد") return "بلاد 🌍";
            if(catName === "جماد") return "جماد 🚗";
            if(catName === "أكلة") return "أكلة 🍎";
            return catName || "فئة عشوائية";
        }

        let myRole = "", audioCtx = null, timerInterval = null, levelTime = 15;
        let aiThinking = false; 
        let lastPlayedTime = -1;

        window.pS = (f, t = 'sine', d = 0.2, v = 0.1) => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = t; o.frequency.value = f;
                g.gain.setValueAtTime(v, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + d);
            } catch(e){}
        };

        function fadeTransition(targetIdToShow, currentIdToHide) {
            const currentLayer = document.getElementById(currentIdToHide);
            const targetLayer = document.getElementById(targetIdToShow);
            if (currentLayer) {
                currentLayer.classList.add('fade-out');
                setTimeout(() => {
                    currentLayer.style.display = 'none';
                    currentLayer.classList.remove('fade-out');
                    if (targetLayer) {
                        targetLayer.style.display = 'flex';
                        targetLayer.classList.add('fade-in');
                        setTimeout(() => targetLayer.classList.remove('fade-in'), 500);
                    }
                }, 500);
            }
        }

        window.setupGame = (role, ai, time, playersCount = 2) => {
            myRole = role; levelTime = time; aiThinking = false; lastPlayedTime = -1;
            window.pS(440, 'triangle', 0.4, 0.05);
            const chars = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي";
            const golden = chars[Math.floor(Math.random() * chars.length)];
            
            fadeTransition('gameArea', 'setupLayer');
            
            set(gameRef, { 
                isAI: ai, status: 'picking', turn: role, timer: time, modePlayers: playersCount,
                used: {}, level: time, p1S: 0, p2S: 0, p3S: 0, p1L: 3, p2L: 3, p3L: 3, 
                golden: golden, currentL: "", aiLastAns: "", currentTypedText: "", cat: ""
            }).then(() => {
                listen();
            });
        };

        window.pick = (l, letterElement) => {
            if (!letterElement || letterElement.classList.contains('used')) return;
            
            letterElement.classList.add('bounce');
            window.pS(600, 'sine', 0.1);
            setTimeout(() => { if(letterElement) letterElement.classList.remove('bounce'); }, 500);
            
            const categories = Object.keys(dictionary);
            const chosenCat = categories[Math.floor(Math.random() * categories.length)];
            
            update(gameRef, { 
                currentL: l, 
                status: "answering", 
                [`used/${l}`]: true, 
                timer: levelTime,
                cat: chosenCat, 
                aiLastAns: "", 
                currentTypedText: "",
                turn: myRole 
            });
        };

        window.submitAns = () => {
            const input = document.getElementById('ansInput');
            const val = input.value.trim();
            if(!val) return;

            get(gameRef).then((snap) => {
                const d = snap.val();
                if (!d) return;
                
                const currentLetter = d.currentL;
                const currentCategory = d.cat;

                const validWords = (dictionary[currentCategory] && dictionary[currentCategory][currentLetter]) || [];
                const isCorrectChar = val.startsWith(currentLetter);
                const isCorrectCat = validWords.some(item => val.includes(item) || item.includes(val));

                if (isCorrectChar && isCorrectCat) {
                    window.pS(1000, 'sine', 0.2);
                    const pts = (currentLetter === d.golden) ? 2 : 1;
                    runTransaction(ref(db, `gameMain/${myRole}S`), s => (s || 0) + pts);
                    getNextTurn(d);
                    input.value = "";
                } else {
                    window.pS(150, 'sawtooth', 0.5);
                    runTransaction(ref(db, `gameMain/${myRole}L`), l => (l || 1) - 1);
                    const suggestedWord = validWords.length > 0 ? validWords[Math.floor(Math.random() * validWords.length)] : "لا توجد في القاموس حالياً";
                    alert(`❌ إجابة خاطئة!\n\nالكلمة المقترحة الصحيحة هي: ✨ "${suggestedWord}" ✨`);
                    getNextTurn(d);
                    input.value = "";
                }
            });
        };

        function getNextTurn(d) {
            let next = 'p1';
            if(d.modePlayers === 3) {
                if(d.turn === 'p1') next = 'p2';
                else if(d.turn === 'p2') next = 'p3';
                else next = 'p1';
            } else {
                next = d.turn === 'p1' ? 'p2' : 'p1';
            }
            aiThinking = false;
            lastPlayedTime = -1;
            update(gameRef, { turn: next, status: 'picking', timer: d.level, currentTypedText: "", cat: "", currentL: "" });
        }

        function listen() {
            onValue(ref(db, 'gameMain'), (snap) => {
                const d = snap.val(); 
                
                if(!d) {
                    clearInterval(timerInterval); timerInterval = null;
                    aiThinking = false;
                    document.getElementById('gameArea').style.display = 'none';
                    document.getElementById('setupLayer').style.display = 'flex';
                    return;
                }
                
                document.getElementById('p1S').innerText = d.p1S !== undefined ? d.p1S : 0;
                document.getElementById('p2S').innerText = d.p2S !== undefined ? d.p2S : 0;
                document.getElementById('p3S').innerText = d.p3S !== undefined ? d.p3S : 0;
                
                document.getElementById('p1Hearts').innerText = "❤️".repeat(d.p1L !== undefined ? d.p1L : 3);
                document.getElementById('p2Hearts').innerText = "❤️".repeat(d.p2L !== undefined ? d.p2L : 3);
                document.getElementById('p3Hearts').innerText = "❤️".repeat(d.p3L !== undefined ? d.p3L : 3);
                
                document.getElementById('timer').innerText = d.timer !== undefined ? d.timer : levelTime;

                if (d.turn !== myRole) {
                    document.getElementById('ansInput').value = d.currentTypedText || "";
                }

                if(d.modePlayers === 3) {
                    document.getElementById('p3Box').style.display = 'block';
                } else {
                    document.getElementById('p3Box').style.display = 'none';
                }

                document.querySelectorAll('.letter').forEach(el => {
                    const letterChar = el.getAttribute('data-letter');
                    const isUsed = d.used && d.used[letterChar];
                    el.className = 'letter' + (isUsed ? ' used' : '');
                    if (letterChar === d.golden) el.classList.add('golden-mode');
                    
                    if (d.status !== 'picking' || d.turn !== myRole) {
                        el.classList.add('lock-pick');
                    } else {
                        el.classList.remove('lock-pick');
                    }
                });

                if (d.status === 'answering' && d.timer <= 3 && d.timer > 0 && d.timer !== lastPlayedTime) {
                    lastPlayedTime = d.timer;
                    window.pS(1200, 'sine', 0.15, 0.3);
                }

                if (d.timer <= 0 && d.status === 'answering' && d.turn === myRole) {
                    runTransaction(ref(db, `gameMain/${myRole}L`), l => (l || 1) - 1);
                    getNextTurn(d);
                }

                if(d.turn === myRole) {
                    document.getElementById('ansInput').disabled = (d.status === 'picking');
                    if (d.status === 'picking') {
                        document.getElementById('msg').innerText = d.aiLastAns ? d.aiLastAns : "دورك الآن: اختر حرفاً";
                    } else {
                        document.getElementById('msg').innerText = getCatWithEmoji(d.cat) + " بحرف (" + (d.currentL || "") + ")";
                    }
                    
                    if(d.status === 'answering' && !timerInterval) {
                        timerInterval = setInterval(() => runTransaction(ref(db, 'gameMain/timer'), t => t > 0 ? t - 1 : 0), 1000);
                    }
                } else {
                    clearInterval(timerInterval); timerInterval = null;
                    
                    if (d.status === 'picking') {
                        document.getElementById('msg').innerText = "الخصم يختار حرفاً الآن...";
                    } else {
                        document.getElementById('msg').innerText = `الخصم يكتب: ${getCatWithEmoji(d.cat)} بحرف (${d.currentL || ""})`;
                    }

                    // نظام الذكاء الاصطناعي المطور والآمن ضد التعليق
                    if (d.isAI && d.turn === 'p2' && !aiThinking) {
                        aiThinking = true;
                        
                        setTimeout(() => {
                            if (d.status === 'picking') {
                                const avail = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split('').filter(l => !d.used || !d.used[l]);
                                if (avail.length > 0) {
                                    const randomLetter = avail[Math.floor(Math.random() * avail.length)];
                                    const categories = Object.keys(dictionary);
                                    const chosenCat = categories[Math.floor(Math.random() * categories.length)];
                                    
                                    update(gameRef, { 
                                        currentL: randomLetter, 
                                        status: "answering", 
                                        [`used/${randomLetter}`]: true, 
                                        timer: d.level,
                                        cat: chosenCat, 
                                        aiLastAns: "", 
                                        currentTypedText: ""
                                    }).then(() => { aiThinking = false; });
                                } else {
                                    aiThinking = false;
                                }
                            } else {
                                const validWords = (dictionary[d.cat] && dictionary[d.cat][d.currentL]) ? dictionary[d.cat][d.currentL] : [];
                                
                                if (validWords && validWords.length > 0) {
                                    // إذا وجدت كلمة، يكتبها فوراً وينتقل الدور بسلاسة
                                    let aiAnswer = validWords[Math.floor(Math.random() * validWords.length)];
                                    window.pS(1000, 'sine', 0.2);
                                    const pts = (d.currentL === d.golden) ? 2 : 1;
                                    update(gameRef, {
                                        p2S: (d.p2S || 0) + pts,
                                        turn: 'p1',
                                        status: 'picking',
                                        timer: d.level,
                                        aiLastAns: `🤖 إجابة الكمبيوتر السابقة: "${aiAnswer}" ✅`,
                                        currentTypedText: aiAnswer
                                    }).then(() => { aiThinking = false; });
                                } else {
                                    // إذا لم يجد (وهذا نادر جداً الآن)، يُخصم منه قلب وينتقل الدور دون تعليق
                                    window.pS(150, 'sawtooth', 0.5);
                                    update(gameRef, {
                                        p2L: (d.p2L || 1) - 1,
                                        turn: 'p1',
                                        status: 'picking',
                                        timer: d.level,
                                        aiLastAns: `🤖 الكمبيوتر عجز عن الإجابة لندرة الحرف! ❌`,
                                        currentTypedText: "عجزت!"
                                    }).then(() => { aiThinking = false; });
                                }
                            }
                        }, 2000);
                    }
                }
            });
        }

        window.cleanServer = () => {
            clearInterval(timerInterval); timerInterval = null;
            aiThinking = false;
            lastPlayedTime = -1;
            remove(gameRef).then(() => {
                document.getElementById('gameArea').style.display = 'none';
                document.getElementById('setupLayer').style.display = 'flex';
            });
        };
    </script>

    <style>
        :root {
            --primary: #2ecc71;
            --primary-glow: rgba(46, 204, 113, 0.6);
            --secondary: #3498db;
            --secondary-glow: rgba(52, 152, 219, 0.6);
            --danger: #e74c3c;
            --danger-glow: rgba(231, 76, 60, 0.6);
            --bg-color: #ffffff;
            --text-color: #333;
        }

        body { margin: 0; background: var(--bg-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; overflow: hidden; text-align: center; color: var(--text-color); position: relative; }
        
        body::after {
            content: "";
            position: absolute; inset: 0;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiIHZpZXdCb3g9IjAgMCA0IDQiPjxnIGZpbGwtcnVsZT0iZXZlbm9kZCI+PGcgZmlsbD0iI2YwZjBmMCIgZmlsbC1vcGFjaXR5PSIwLjQiPjxwYXRoIGQ9Ik0wIDBoMnYySDBWMHptMiAyaDJ2MkgYVjJ6TTAgMmgydjJIMFYye m0yIDBoMnYySDJWMHoiLz48L2c+PC9nPjwvc3ZnPg==');
            opacity: 0.3;
            z-index: -1;
        }

        #setupLayer, #gameArea { position: fixed; inset: 0; background: var(--bg-color); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; transition: opacity 0.5s ease; }
        #gameArea { display: none; z-index: 1000; padding: 0; justify-content: flex-start; }
        
        .fade-out { opacity: 0; pointer-events: none; }
        .fade-in { opacity: 1; }

        .mode-card { background: #fff; padding: 25px; border-radius: 20px; border: 1px solid #eee; width: 90%; max-width: 400px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { font-size: 2.5rem; margin-bottom: 30px; color: #2d3436; }
        h3 { margin: 5px 0 15px 0; color: #666; font-weight: 600; }
        p { margin: 10px 0; font-weight: bold; color: #888; font-size: 0.9rem; }

        .btn { padding: 14px 24px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin: 6px; display: inline-block; font-size: 1rem; transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .btn-green { background: var(--primary); color: white; box-shadow: 0 0 10px var(--primary-glow); }
        .btn-yellow { background: #f1c40f; color: black; box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .btn-red { background: var(--danger); color: white; box-shadow: 0 0 10px var(--danger-glow); }
        .btn-blue { background: var(--secondary); color: white; box-shadow: 0 0 10px var(--secondary-glow); }
        .btn-purple { background: #9b59b6; color: white; box-shadow: 0 0 10px rgba(155, 89, 182, 0.5); }

        .score-bar { display: flex; justify-content: space-around; padding: 20px; border-bottom: 1px solid #eee; align-items: center; background: #fff; width: 100%; box-sizing: border-box; }
        .hearts { color: var(--danger); font-size: 1.2rem; display: block; min-height: 24px; margin-bottom: 5px; letter-spacing: 2px; }
        #timer { font-size: 4rem; font-weight: 900; color: #2d3436; }
        .player-info { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
        .score-num { font-size: 1.5rem; font-weight: bold; color: #555; }

        #msg { margin: 20px 0; font-size: 1.3rem; color: #2d3436; font-weight: 600; min-height: 40px; }

        .ans-container { display: flex; padding: 0 20px; gap: 10px; width: 100%; max-width: 600px; box-sizing: border-box; }
        .ans-box { flex-grow: 1; padding: 18px; border-radius: 15px; border: 2px solid #eee; font-size: 1.3rem; text-align: center; outline: none; font-weight: bold; }
        .ans-box:focus { border-color: var(--secondary); }

        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; padding: 20px; width: 100%; max-width: 800px; box-sizing: border-box; margin-top: 20px; }
        .letter { background: #fff; display: flex; align-items: center; justify-content: center; border: 2px solid #f0f0f0; border-radius: 18px; font-size: 1.6rem; font-weight: bold; color: #444; cursor: pointer; transition: all 0.3s ease; padding: 15px 0; }
        
        .golden-mode { border: 3px solid #ffd700 !important; background: #fffdf0 !important; color: #b8860b !important; }
        .used { opacity: 0.15; pointer-events: none; transform: scale(0.9); }
        .lock-pick { cursor: not-allowed; opacity: 0.6; }

        @media (max-width: 600px) {
            .letter { font-size: 1.3rem; border-radius: 12px; padding: 10px 0; }
            .grid { gap: 8px; grid-template-columns: repeat(6, 1fr); }
            #timer { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div id="setupLayer">
        <h1>🏆 سباق الحروف</h1>
        
        <div class="mode-card">
            <h3>👤 ضد الكمبيوتر (الذكاء الاصطناعي)</h3>
            <button class="btn btn-green" onclick="setupGame('p1', true, 20)">سهل 🟢</button>
            <button class="btn btn-yellow" onclick="setupGame('p1', true, 15)">متوسط 🟡</button>
            <button class="btn btn-red" onclick="setupGame('p1', true, 7)">صعب 🔴</button>
        </div>

        <div class="mode-card">
            <h3>👥 تحدي الأصدقاء (تعدد اللاعبين)</h3>
            <p>نمط لاعبين اثنين (2):</p>
            <button class="btn btn-blue" onclick="setupGame('p1', false, 15, 2)">لاعب 1</button>
            <button class="btn btn-blue" onclick="setupGame('p2', false, 15, 2)">لاعب 2</button>
            
            <p style="margin-top: 15px;">نمط ثلاثة لاعبين (3):</p>
            <button class="btn btn-purple" onclick="setupGame('p1', false, 15, 3)">لاعب 1</button>
            <button class="btn btn-purple" onclick="setupGame('p2', false, 15, 3)">لاعب 2</button>
            <button class="btn btn-purple" onclick="setupGame('p3', false, 15, 3)">لاعب 3</button>
        </div>

        <button class="btn" style="background:#333; color:white; margin-top:20px;" onclick="cleanServer()">🔄 تصفير السيرفر بالكامل</button>
    </div>

    <div id="gameArea">
        <div class="score-bar">
            <div class="player-info">P1<span id="p1Hearts" class="hearts">❤️❤️❤️</span><b id="p1S" class="score-num">0</b></div>
            <div id="timer">15</div>
            <div class="player-info">P2<span id="p2Hearts" class="hearts">❤️❤️❤️</span><b id="p2S" class="score-num">0</b></div>
            <div id="p3Box" class="player-info" style="display:none;">P3<span id="p3Hearts" class="hearts">❤️❤️❤️</span><b id="p3S" class="score-num">0</b></div>
        </div>

        <h2 id="msg">اختر حرفاً</h2>

        <div class="ans-container">
            <input type="text" id="ansInput" class="ans-box" placeholder="اكتب الإجابة هنا..." disabled autocomplete="off">
            <button class="btn btn-green" style="padding:18px 28px;" onclick="submitAns()">✅</button>
        </div>

        <div class="grid">
            <script>
                const arChars = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split('');
                arChars.forEach(l => {
                    document.write(`<div class="letter" data-letter="${l}" onclick="pick('${l}', this)">${l}</div>`);
                });
            </script>
        </div>
        
        <button class="btn" style="background:#f1c40f; color:black; margin-top:auto; margin-bottom: 20px; font-size: 0.8rem; padding: 8px 16px;" onclick="cleanServer()">🔄 خروج للقائمة الرئيسية</button>
    </div>

</body>
</html>
