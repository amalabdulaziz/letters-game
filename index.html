<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>سباق الحروف 🏆</title>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.1/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue,
update,
runTransaction

} from "https://www.gstatic.com/firebasejs/9.1.1/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyCRerGp0Wfj7QoxzMNYnWX0zmtg1NAEBls",

databaseURL:
"https://letters-game-ff80c-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId: "letters-game-ff80c"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const gameRef = ref(db, 'gameMain');

const dictionary = {

"حيوان 🦁": {

"أ": ["أسد","أرنب","أفعى"],
"ب": ["ببر","بقرة","بومة"],
"ت": ["تمساح","تيس"],
"ث": ["ثعلب","ثور"],
"ج": ["جمل","جراد"],
"ح": ["حصان","حمار","حوت"],
"خ": ["خروف","خنزير","خفاش"],
"د": ["دب","ديك","دجاج"],
"ذ": ["ذئب","ذبابة"],
"ر": ["راكون","ريم"],
"ز": ["زرافة","زنبور"],
"س": ["سمكة","سنجاب","سلحفاة"],
"ش": ["شبل","شاهين"],
"ص": ["صقر","صرصور"],
"ض": ["ضفدع","ضبع"],
"ط": ["طاووس","طير"],
"ظ": ["ظبي"],
"ع": ["عقرب","عصفور"],
"غ": ["غزال","غراب"],
"ف": ["فيل","فهد","فأر"],
"ق": ["قرد","قطة","قرش"],
"ك": ["كلب","كنغر"],
"ل": ["لقلق","ليث"],
"م": ["ماعز","مهر"],
"ن": ["نمر","نمل"],
"ه": ["هدهد","هامستر"],
"و": ["وزة","وحيد القرن"],
"ي": ["يمامة","يربوع"]

},

"جماد 🚗": {

"أ": ["أريكة","إبريق"],
"ب": ["باب","برميل"],
"ت": ["تلفاز","تاج"],
"ث": ["ثلاجة","ثوب"],
"ج": ["جوال","جدار"],
"ح": ["حقيبة","حجر"],
"خ": ["خزانة","خشب"],
"د": ["دفتر","دراجة"],
"ذ": ["ذهب"],
"ر": ["راديو","رصاص"],
"ز": ["زجاج","زر"],
"س": ["سيارة","سرير"],
"ش": ["شباك","شمعة"],
"ص": ["صندوق","صحن"],
"ض": ["ضوء"],
"ط": ["طاولة","طائرة"],
"ظ": ["ظرف"],
"ع": ["عربة","عصا"],
"غ": ["غسالة"],
"ف": ["فانوس","فستان"],
"ق": ["قلم","قطار"],
"ك": ["كتاب","كرسي"],
"ل": ["لوحة","لمبة"],
"م": ["مكتب","مقص"],
"ن": ["نظارة","نافذة"],
"ه": ["هاتف","هرم"],
"و": ["ورقة","وسادة"],
"ي": ["يخت"]

},

"بلاد 🌍": {

"أ": ["ألمانيا","أردن"],
"ب": ["بحرين","برازيل"],
"ت": ["تونس","تركيا"],
"ث": ["ثيساليا"],
"ج": ["جزائر","جيبوتي"],
"ح": ["حائل"],
"خ": ["خرطوم"],
"د": ["دنمارك","دبي"],
"ذ": ["ذي قار"],
"ر": ["روسيا","رياض"],
"ز": ["زامبيا"],
"س": ["سعودية","سوريا"],
"ش": ["شيلي"],
"ص": ["صين","صربيا"],
"ض": ["ضبا"],
"ط": ["طائف","طوكيو"],
"ظ": ["ظهران"],
"ع": ["عراق","عمان"],
"غ": ["غانا"],
"ف": ["فرنسا","فلسطين"],
"ق": ["قطر","قبرص"],
"ك": ["كويت","كندا"],
"ل": ["لبنان","ليبيا"],
"م": ["مصر","مغرب"],
"ن": ["نرويج","نيبال"],
"ه": ["هند","هولندا"],
"و": ["ويلز"],
"ي": ["يابان","يمن"]

},

"أكلة 🍎": {

"أ": ["أرز","أناناس"],
"ب": ["بيتزا","برغر"],
"ت": ["تمر","تفاح"],
"ث": ["ثوم"],
"ج": ["جبن","جزر"],
"ح": ["حمص","حلوى"],
"خ": ["خيار","خوخ"],
"د": ["دجاج","دونات"],
"ذ": ["ذرة"],
"ر": ["رمان","رقاق"],
"ز": ["زبادي","زعتر"],
"س": ["سمك","سلطة"],
"ش": ["شاورما","شوكولاتة"],
"ص": ["صيادية"],
"ض": ["ضلوع مشوية"],
"ط": ["طماطم","طحينة"],
"ظ": ["ظبي مطبوخ"],
"ع": ["عسل","عنب"],
"غ": ["غريبة"],
"ف": ["فول","فراولة"],
"ق": ["قشطة","قمح"],
"ك": ["كبسة","كباب"],
"ل": ["لحم","ليمون"],
"م": ["مندي","موز"],
"ن": ["نعناع","نوتيلا"],
"ه": ["هريس"],
"و": ["ورق عنب"],
"ي": ["يوسفي"]

}

};

let myRole = "";
let timerInterval = null;
let levelTime = 15;

window.setupGame = (role, ai, time) => {

myRole = role;
levelTime = time;

const chars =
"أبتثجحخدذرزسشصضطظعغفقكلمنهوي";

const golden =
chars[Math.floor(Math.random() * chars.length)];

document.getElementById('setupLayer').style.display =
'none';

set(gameRef, {

isAI: ai,
status: 'picking',
turn: 'p1',
timer: time,

used: {},

level: time,

p1S: 0,
p2S: 0,

golden: golden,
currentL: ""

});

listen();

};

window.pick = (l) => {

const categories = Object.keys(dictionary);

update(gameRef, {

currentL: l,

status: "answering",

[`used/${l}`]: true,

timer: 15,

cat: categories[
Math.floor(Math.random() * 4)
]

});

};

window.submitAns = () => {

const input =
document.getElementById('ansInput');

const val = input.value.trim();

if(!val) return;

onValue(gameRef, (snap) => {

const d = snap.val();

if (!d) return;

const validWords =
dictionary[d.cat]?.[d.currentL] || [];

const correct =
validWords.includes(val);

if(correct){

runTransaction(
ref(db, `gameMain/${myRole}S`),
s => (s || 0) + 1
);

update(gameRef, {

turn: 'p2',
status: 'picking',
timer: d.level

});

input.value = "";

}else{

alert("❌ إجابة خاطئة");

}

},{onlyOnce:true});

};

function listen(){

onValue(gameRef, (snap)=>{

const d = snap.val();

if(!d) return;

document.getElementById('p1S').innerText =
d.p1S || 0;

document.getElementById('p2S').innerText =
d.p2S || 0;

document.getElementById('timer').innerText =
d.timer;

document.getElementById('msg').innerText =

d.status === 'picking'

? "اختر حرفاً"

: `${d.cat} بحرف (${d.currentL})`;

if(d.turn === myRole){

document.getElementById('lock').style.display =
'none';

document.getElementById('ansInput').disabled =
(d.status === 'picking');

}else{

document.getElementById('lock').style.display =
'flex';

}

if (
d.turn === myRole &&
d.status === 'answering'
){

if(!timerInterval){

timerInterval = setInterval(()=>{

runTransaction(
ref(db, 'gameMain/timer'),
t => t > 0 ? t - 1 : 0
);

},1000);

}

}else{

clearInterval(timerInterval);
timerInterval = null;

}

if (
d.timer <= 0 &&
d.status === 'answering'
){

update(gameRef, {

turn:
d.turn === 'p1'
? 'p2'
: 'p1',

status: 'picking',

timer: d.level

});

}















// 🤖 الذكاء الاصطناعي الجديد

if (d.isAI && d.turn === 'p2') {

setTimeout(() => {

if (d.status === 'picking') {

const avail =
"أبتثجحخدذرزسشصضطظعغفقكلمنهوي"
.split('')
.filter(l =>
!d.used ||
!d.used[l]
);

if (avail.length > 0) {

pick(

avail[
Math.floor(
Math.random() *
avail.length
)
]

);

}

}

else {

const words =
dictionary[d.cat]?.[d.currentL] || [];

if (words.length > 0) {

const aiWord =

words[
Math.floor(
Math.random() *
words.length
)
];

document.getElementById("aiAnswer")
.innerText =

"🤖 الكمبيوتر كتب: " +
aiWord;

runTransaction(

ref(db, 'gameMain/p2S'),

s => (s || 0) + 1

);

update(gameRef, {

turn: 'p1',

status: 'picking',

timer: d.level

});

}
else{

document.getElementById("aiAnswer")
.innerText =

"🤖 الكمبيوتر لم يجد إجابة";

update(gameRef, {

turn: 'p1',

status: 'picking',

timer: d.level

});

}

}

},2500);

}

});

}

</script>

<style>

body{

margin:0;
background:#fff;
font-family:sans-serif;
text-align:center;

}

#setupLayer{

position:fixed;
inset:0;

background:white;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:20px;

}

.btn{

padding:15px 20px;

border:none;

border-radius:15px;

font-size:1rem;

font-weight:bold;

}

.green{
background:#2ecc71;
color:white;
}

.yellow{
background:#f1c40f;
}

.red{

color:white;
}

.score{

display:flex;

justify-content:space-around;

}

.grid{

display:grid;

grid-template-columns:

}

font-weight:bold;

cursor:pointer;

}

.used{

opacity:0.2;
pointer-events:none;

}

#lock{

position:fixed;

inset:0;

background:rgba(255,255,255,.8);

display:none;

justify-content:center;

align-items:center;

font-size:2rem;

}

#aiAnswer{

font-size:1.2rem;

font-weight:bold;

color:#555;

height:30px;

margin-bottom:10px;

}

</style>

</head>

<body>

<div id="setupLayer">

<h1>🏆 سباق الحروف</h1>

<div>

<button
class="btn green"
onclick="setupGame('p1',true,20)"
>

سهل

</button>

<button
class="btn yellow"
onclick="setupGame('p1',true,15)"
>

متوسط

</button>

<button
class="btn red"
onclick="setupGame('p1',true,7)"
>

صعب

</button>

</div>

</div>

<div id="lock">

⏳ انتظر دور الخصم...

</div>

<div class="score">

<div>
P1:
<b id="p1S">0</b>
</div>

<div id="timer">
15
</div>

<div>
P2:
<b id="p2S">0</b>
</div>

</div>

<h2 id="msg">

اختر حرفاً

</h2>

<div id="aiAnswer"></div>

<div style="padding:15px">

<input
type="text"
id="ansInput"
placeholder="اكتب الإجابة..."
style="
padding:15px;
width:70%;
border-radius:15px;
border:2px solid #ddd;
font-size:1.1rem;
"
disabled
>

<button
class="btn green"
onclick="submitAns()"
>

✅

</button>

</div>

<div class="grid">

<script>

"أبتثجحخدذرزسشصضطظعغفقكلمنهوي"

.split('')

.forEach(l=>{

document.write(`

<div
class="letter"
onclick="pick('${l}')"
>

${l}

</div>

`);

});

</script>

</div>

</body>
</html>
