<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق الحروف - نسخة التدقيق الذكي 🧠</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, runTransaction } from "https://www.gstatic.com/firebasejs/9.1.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRerGp0Wfj7QoxzMNYnWX0zmtg1NAEBls",
            databaseURL: "https://letters-game-ff80c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "letters-game-ff80c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameRef = ref(db, 'letterGame');

        // قاموس بسيط للتدقيق (يمكنك توسيعه لاحقاً)
        const dictionary = {
            "حيوان 🦁": ["أسد", "أرنب", "بطة", "بقر", "تمساح", "ثعلب", "جمل", "حصان", "حمار", "خروف", "دجاج", "ذئب", "زرافة", "سمكة", "صقر", "ضفدع", "غزال", "فيل", "قرد", "كلب", "نمر", "هدهد"],
            "بلاد 🌍": ["ألمانيا", "أمريكا", "أردن", "بحرين", "بلجيكا", "تونس", "تركيا", "جزائر", "دنمارك", "روسيا", "سعودية", "سوريا", "سودان", "صين", "عراق", "عمان", "فرنسا", "فلسطين", "قطر", "كويت", "لبنان", "مصر", "مغرب", "يمن"],
            "جماد 🚗": ["إبريق", "باب", "بيت", "تلفاز", "ثلاجة", "جدار", "حقيبة", "خزانة", "دفتر", "راديو", "سيارة", "سبورة", "شباك", "طاولة", "قلم", "كتاب", "لوحة", "مكتب", "هاتف"],
            "أكلة 🍎": ["أرز", "بيتزا", "برغر", "تمر", "تفاح", "جبن", "حلوى", "خبز", "خوخ", "دجاج", "ذرة", "رمان", "زيتون", "سمك", "سلطة", "شوربة", "عسل", "عنب", "فراولة", "فول", "كباب", "لحم", "مانجو", "موز"]
        };

        let myRole = "", audioCtx = null, timerInterval = null;
        const categories = Object.keys(dictionary);

        window.playSound = (freq, type = 'sine', duration = 0.2, vol = 0.2) => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.setValueAtTime(vol, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + duration);
        };

        window.setupGame = (role, ai, time) => {
            myRole = role;
            const chars = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي";
            const goldenL = chars[Math.floor(Math.random() * chars.length)];
            set(gameRef, { 
                isAI: ai, status: 'picking', turn: 'p1', timer: time, 
                used: {}, level: time, p1S: 0, p2S: 0, p1L: 3, p2L: 3, 
                golden: goldenL, currentL: "" 
            });
            document.getElementById('setupLayer').style.display = 'none';
            listen();
        };

        window.pick = (l) => {
            update(gameRef, { 
                currentL: l, status: "answering", [`used/${l}`]: true, timer: 15,
                cat: categories[Math.floor(Math.random() * categories.length)]
            });
        };

        window.submitAns = () => {
            const input = document.getElementById('ansInput');
            const val = input.value.trim();
            onValue(gameRef, (snap) => {
                const d = snap.val();
                // التدقيق: هل تبدأ بالحرف؟ وهل هي موجودة في قائمة التصنيف؟
                const isCorrectChar = val.startsWith(d.currentL);
                const categoryList = dictionary[d.cat] || [];
                const isCorrectCat = categoryList.some(item => val.includes(item) || item.includes(val));

                if (isCorrectChar && isCorrectCat) {
                    const pts = (d.currentL === d.golden) ? 2 : 1;
                    runTransaction(ref(db, `letterGame/${myRole}S`), s => (s || 0) + pts);
                    update(gameRef, { turn: (myRole==='p1'?'p2':'p1'), status:'picking', timer: d.level });
                    input.value = "";
                } else {
                    window.playSound(100, 'sawtooth', 0.5);
                    alert(isCorrectChar ? `عذراً، "${val}" ليست ${d.cat}!` : `يجب أن تبدأ بحرف ${d.currentL}`);
                }
            }, {onlyOnce: true});
        };

        function listen() {
            onValue(gameRef, (snap) => {
                const d = snap.val(); if(!d) return;
                document.getElementById('p1S').innerText = d.p1S;
                document.getElementById('p2S').innerText = d.p2S;
                document.getElementById('p1Hearts').innerText = "❤️".repeat(d.p1L);
                document.getElementById('p2Hearts').innerText = "❤️".repeat(d.p2L);
                document.getElementById('timer').innerText = d.timer;

                document.querySelectorAll('.letter').forEach(el => {
                    el.className = 'letter' + (d.used && d.used[el.innerText] ? ' used' : '');
                    if (el.innerText === d.golden) el.classList.add('golden-border');
                });

                if (d.timer <= 0 && d.status === 'answering' && d.turn === myRole) {
                    runTransaction(ref(db, `letterGame/${myRole}L`), l => (l || 1) - 1);
                    update(gameRef, { turn: (myRole==='p1'?'p2':'p1'), status:'picking', timer: d.level });
                }

                if(d.turn === myRole) {
                    document.getElementById('lock').style.display = 'none';
                    document.getElementById('ansInput').disabled = (d.status === 'picking');
                    document.getElementById('msg').innerText = d.status==='picking' ? "دورك: اختر حرفاً" : d.cat + " بحرف (" + d.currentL + ")";
                    if(d.status === 'answering' && !timerInterval) {
                        timerInterval = setInterval(() => runTransaction(ref(db, 'letterGame/timer'), t => t > 0 ? t - 1 : 0), 1000);
                    }
                } else {
                    document.getElementById('lock').style.display = 'flex';
                    clearInterval(timerInterval); timerInterval = null;
                }
            });
        }
    </script>

    <style>
        body { margin: 0; background: #ffffff; font-family: sans-serif; height: 100vh; overflow: hidden; text-align: center; }
        #setupLayer { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .mode-card { background: #f9f9f9; padding: 20px; border-radius: 20px; margin: 10px; width: 80%; border: 1px solid #eee; }
        .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: #2ecc71; color: white; margin: 5px; }
        .score-bar { display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid #f5f5f5; align-items: center; }
        .hearts { color: #e74c3c; font-size: 1rem; display: block; }
        .ans-container { display: flex; padding: 10px; gap: 10px; }
        .ans-box { flex-grow: 1; padding: 15px; border-radius: 12px; border: 2px solid #eee; font-size: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding: 15px; height: 45vh; }
        .letter { background: white; display: flex; align-items: center; justify-content: center; border: 2px solid #f0f0f0; border-radius: 15px; font-size: 1.5rem; font-weight: bold; }
        .golden-border { border: 3px solid #ffd700 !important; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .used { opacity: 0.2; pointer-events: none; }
        #lock { position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; }
        #timer { font-size: 3rem; font-weight: 900; }
    </style>
</head>
<body>
    <div id="setupLayer">
        <h1>🏆 تحدي الحروف الذكي</h1>
        <div class="mode-card">
            <button class="btn" onclick="setupGame('p1', true, 15)">ابدأ اللعب ضد الكمبيوتر</button>
        </div>
        <button class="btn" style="background:#333" onclick="remove(ref(getDatabase(), 'letterGame')).then(() => location.reload())">🔄 تصفير</button>
    </div>

    <div id="lock"><h2>⏳ دور الخصم...</h2></div>

    <div class="score-bar">
        <div>P1<br><span id="p1Hearts" class="hearts"></span><b id="p1S">0</b></div>
        <div id="timer">15</div>
        <div>P2<br><span id="p2Hearts" class="hearts"></span><b id="p2S">0</b></div>
    </div>

    <h2 id="msg" style="margin: 10px 0; color: #555;">اختر حرفاً</h2>

    <div class="ans-container">
        <input type="text" id="ansInput" class="ans-box" placeholder="اكتب هنا..." disabled autocomplete="off">
        <button class="btn" onclick="submitAns()">✅</button>
    </div>

    <div class="grid">
        <script>
            "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split('').forEach(l => {
                document.write(`<div class="letter" onclick="pick('${l}')">${l}</div>`);
            });
        </script>
    </div>
</body>
</html>
