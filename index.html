<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سباق الحروف 🏆</title>

<style>

body{
    margin:0;
    background:#fff;
    font-family:sans-serif;
    text-align:center;
    overflow:hidden;
    color:#333;
}

.score-bar{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:15px;
    border-bottom:2px solid #f5f5f5;
}

.hearts{
    color:#e74c3c;
    display:block;
    height:25px;
}

#timer{
    font-size:3rem;
    font-weight:bold;
}

#msg{
    margin-top:15px;
}

.ans-container{
    display:flex;
    gap:10px;
    padding:15px;
}

.ans-box{
    flex-grow:1;
    padding:15px;
    border-radius:15px;
    border:2px solid #eee;
    font-size:1.2rem;
    text-align:center;
    transition:0.2s;
}

.btn{
    padding:12px 20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

.btn:hover{
    transform:scale(1.05);
}

.btn-green{
    background:#2ecc71;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    padding:15px;
}

.letter{
    background:white;
    border:2px solid #f5f5f5;
    border-radius:15px;
    height:60px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:1.4rem;
    font-weight:bold;

    transition:0.25s;
}

.letter:hover{
    transform:scale(1.08);
}

.used{
    opacity:0.1;
    transform:scale(0.7);
    pointer-events:none;
}

.golden-mode{
    border:3px solid gold !important;
    background:#fff8dc !important;
    color:#b8860b !important;
    box-shadow:0 0 15px rgba(255,215,0,0.5);
}

#lock{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(4px);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:1000;
}

#winnerScreen{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.95);

    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    z-index:9999;
}

@keyframes shake {

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-5px);
    }

    50%{
        transform:translateX(5px);
    }

    75%{
        transform:translateX(-5px);
    }

    100%{
        transform:translateX(0);
    }
}

.shake{
    animation:shake 0.3s;
}

</style>
</head>

<body>

<div id="winnerScreen">

    <h1 id="winnerText"></h1>

    <button class="btn btn-green" onclick="location.reload()">
        🔄 لعب مرة أخرى
    </button>

</div>

<div id="lock">
    <h2>⏳ دور الخصم...</h2>
</div>

<div class="score-bar">

    <div>
        P1
        <span class="hearts" id="p1Hearts">❤️❤️❤️</span>
        <b id="p1S">0</b>
    </div>

    <div id="timer">15</div>

    <div>
        P2
        <span class="hearts" id="p2Hearts">❤️❤️❤️</span>
        <b id="p2S">0</b>
    </div>

</div>

<h2 id="msg">اختر حرفاً</h2>

<div class="ans-container">

    <input
        type="text"
        id="ansInput"
        class="ans-box"
        placeholder="اكتب الإجابة..."
        autocomplete="off"
    >

    <button class="btn btn-green" onclick="submitAns()">
        ✅
    </button>

</div>

<div class="grid" id="lettersGrid"></div>

<script>

const chars = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي";

const dictionary = {
    "حيوان 🦁": ["أسد","أرنب","بطة","بقر","تمساح","جمل","حصان","خروف","دجاج","فيل","قرد","كلب","نمر","قطة"],
    "بلاد 🌍": ["ألمانيا","أردن","بحرين","تونس","تركيا","جزائر","سعودية","سوريا","عراق","عمان","فرنسا","فلسطين","قطر","كويت","لبنان","مصر","مغرب","يمن"],
    "جماد 🚗": ["باب","بيت","تلفاز","ثلاجة","حقيبة","خزانة","دفتر","سيارة","طاولة","قلم","كتاب","هاتف","كرسي"],
    "أكلة 🍎": ["أرز","بيتزا","برغر","تمر","تفاح","جبن","خبز","شوربة","عسل","عنب","كباب","لحم","موز"]
};

let currentLetter = "";
let currentCategory = "";
let timer = 15;

let p1S = 0;
let p2S = 0;

let p1L = 3;
let p2L = 3;

let usedLetters = {};
let usedAnswers = {};

const goldenLetter =
    chars[Math.floor(Math.random() * chars.length)];

chars.split('').forEach(l => {

    const div = document.createElement("div");

    div.className = "letter";

    if(l === goldenLetter){
        div.classList.add("golden-mode");
    }

    div.innerText = l;

    div.onclick = () => pickLetter(l);

    document.getElementById("lettersGrid").appendChild(div);

});

function pickLetter(letter){

    if(usedLetters[letter]) return;

    currentLetter = letter;

    usedLetters[letter] = true;

    document.querySelectorAll(".letter").forEach(el => {

        if(el.innerText === letter){
            el.classList.add("used");
        }

    });

    const cats = Object.keys(dictionary);

    currentCategory =
        cats[Math.floor(Math.random() * cats.length)];

    document.getElementById("msg").innerText =
        currentCategory + " بحرف (" + currentLetter + ")";

    timer = 15;

}

function submitAns(){

    const input =
        document.getElementById("ansInput");

    const val = input.value.trim();

    if(!val) return;

    if(usedAnswers[val]){

        alert("تم استخدام الكلمة مسبقاً");

        return;
    }

    const correctLetter =
        val.startsWith(currentLetter);

    const correctWord =
        (dictionary[currentCategory] || []).includes(val);

    if(correctLetter && correctWord){

        usedAnswers[val] = true;

        const pts =
            currentLetter === goldenLetter ? 2 : 1;

        p1S += pts;

        document.getElementById("p1S").innerText = p1S;

        input.value = "";

        document.getElementById("msg").innerText =
            "اختر حرفاً جديداً";

    } else {

        // الاهتزاز
        input.classList.remove("shake");

        void input.offsetWidth;

        input.classList.add("shake");

        setTimeout(() => {
            input.classList.remove("shake");
        }, 400);

        alert("إجابة خاطئة ❌");

    }

}

setInterval(() => {

    if(currentLetter){

        timer--;

        document.getElementById("timer").innerText = timer;

        if(timer <= 0){

            p1L--;

            document.getElementById("p1Hearts").innerText =
                "❤️".repeat(p1L);

            timer = 15;

            currentLetter = "";

            document.getElementById("msg").innerText =
                "انتهى الوقت ⏰";

            if(p1L <= 0){

                document.getElementById("winnerScreen").style.display = "flex";

                document.getElementById("winnerText").innerText =
                    "😢 خسرت اللعبة";

            }

        }

    }

},1000);

</script>

</body>
</html>
