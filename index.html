<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سباق الحروف 🏁</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, runTransaction } from "https://www.gstatic.com/firebasejs/9.1.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRerGp0Wfj7QoxzMNYnWX0zmtg1NAEBls",
            databaseURL: "https://letters-game-ff80c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "letters-game-ff80c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameRef = ref(db, 'letterGame');

        let myRole = "", audioCtx = null, timerInterval = null, currentLetter = "";

        // بدء اللعبة + محاولة التكبير التلقائي
        window.initGame = (role, ai = false) => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // محاولة تكبير الشاشة
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            myRole = role;
            update(gameRef, { isAI: ai });
            document.getElementById('setupLayer').style.display = 'none';
            listen();
        };

        window.playSound = (freq) => {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'square'; o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = freq; o.start();
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            o.stop(audioCtx.currentTime + 0.1);
        };

        window.forceReset = () => {
            remove(gameRef).then(() => {
                set(gameRef, { p1S:0, p2S:0, turn:'p1', status:'picking', timer:15, isAI:false });
                location.reload();
            });
        };

        window.pick = (l) => {
            playSound(600);
            const cats = ["حيوان","جماد","بلاد","أكلة","مهنة"];
            update(gameRef, { 
                currentL: l, 
                status: "answering", 
                [`used/${l}`]: true, 
                timer: 15,
                cat: cats[Math.floor(Math.random()*cats.length)]
            });
        };

        window.submitAns = () => {
            const input = document.getElementById('ansInput');
            const val = input.value.trim();
            if (val.startsWith(currentLetter)) {
                playSound(1200);
                runTransaction(ref(db, `letterGame/${myRole}S`), (s) => (s || 0) + 1);
                update(gameRef, { turn: (myRole === 'p1' ? 'p2' : 'p1'), status: 'picking', timer: 15 });
                input.value = "";
            } else {
                playSound(200);
                alert("يجب البدء بحرف " + currentLetter);
            }
        };

        function listen() {
            onValue(gameRef, (snap) => {
                const d = snap.val(); if(!d) return;
                
                currentLetter = d.currentL || ""; // إصلاح مشكلة undefined
                document.getElementById('timer').innerText = d.timer;
                document.getElementById('p1S').innerText = d.p1S || 0;
                document.getElementById('p2S').innerText = d.p2S || 0;

                if (d.turn === myRole && d.status === 'answering' && d.timer <= 5 && d.timer > 0) playSound(1500);

                document.querySelectorAll('.letter').forEach(el => {
                    el.classList.toggle('used', !!(d.used && d.used[el.innerText]));
                });

                if(d.turn === myRole) {
                    document.getElementById('lock').style.display = 'none';
                    document.getElementById('ansInput').disabled = (d.status === 'picking');
                    // عرض الحرف بشكل صحيح هنا
                    document.getElementById('msg').innerText = d.status==='picking' ? "دورك الآن: اختر حرفاً" : d.cat + " بحرف (" + currentLetter + ")";
                    if(d.status==='answering' && !timerInterval) startTimer();
                } else {
                    document.getElementById('lock').style.display = 'flex';
                    clearInterval(timerInterval); timerInterval = null;
                    
                    if (d.isAI && d.turn === 'p2' && myRole === 'p1') {
                        setTimeout(() => {
                            if (d.status === 'picking') {
                                const avail = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split('').filter(l => !d.used || !d.used[l]);
                                if (avail.length > 0) pick(avail[0]);
                            } else {
                                update(gameRef, { p2S: (d.p2S||0)+1, turn: 'p1', status: 'picking', timer: 15 });
                            }
                        }, 2500);
                    }
                }
            });
        }

        function startTimer() {
            let t = 15;
            timerInterval = setInterval(() => {
                t--; update(gameRef, { timer: t });
                if(t <= 0) {
                    clearInterval(timerInterval); timerInterval = null;
                    update(gameRef, { turn: (myRole==='p1'?'p2':'p1'), status:'picking', timer: 15 });
                }
            }, 1000);
        }
    </script>

    <style>
        :root { --gold: #ffd700; --bg: #0a0f1e; --btn: #1e2a44; }
        * { box-sizing: border-box; touch-action: manipulation; }
        body { height: 100vh; width: 100vw; margin: 0; background: var(--bg); color: white; overflow: hidden; position: fixed; font-family: sans-serif; }
        
        #setupLayer { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-style { width: 280px; padding: 20px; margin: 10px; border: 2px solid var(--gold); border-radius: 12px; font-size: 1.2rem; background: var(--btn); color: white; font-weight: bold; cursor: pointer; }

        .score-bar { display: flex; justify-content: space-around; background: #161e31; padding: 15px; border-bottom: 2px solid var(--gold); align-items: center; }
        
        .ans-container { display: flex; width: 95%; margin: 10px auto; gap: 5px; }
        .ans-box { flex-grow: 1; padding: 15px; border-radius: 10px; border: 2px solid var(--gold); background: #000; color: #fff; font-size: 18px !important; text-align: center; }
        .check-btn { padding: 10px 20px; background: var(--gold); color: black; border: none; border-radius: 10px; font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 10px; height: 50vh; }
        .letter { background: var(--btn); display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #333; font-weight: bold; color: var(--gold); font-size: 1.3rem; }
        .used { opacity: 0.1; pointer-events: none; }
        
        #lock { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; }
        #timer { font-size: 2.2rem; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <div id="setupLayer">
        <h1 style="color:var(--gold)">سباق الحروف</h1>
        <button class="btn-style" onclick="initGame('p1', true)">👤 ضد الكمبيوتر</button>
        <button class="btn-style" onclick="initGame('p1', false)">👥 لاعب 1 (أونلاين)</button>
        <button class="btn-style" onclick="initGame('p2', false)">👥 لاعب 2 (أونلاين)</button>
        <button class="btn-style" style="border-color:red; color:red;" onclick="forceReset()">🔄 تصفير اللعبة</button>
    </div>

    <div id="lock"><h2>⏳ دور الخصم..</h2></div>

    <div class="score-bar">
        <div>P1: <b id="p1S">0</b></div>
        <div id="timer">15</div>
        <div>P2: <b id="p2S">0</b></div>
    </div>

    <h3 id="msg" style="text-align:center; color:var(--gold); margin: 5px 0;">اختر حرفاً</h3>
    
    <div class="ans-container">
        <input type="text" id="ansInput" class="ans-box" placeholder="اكتب هنا..." disabled autocomplete="off">
        <button class="check-btn" onclick="submitAns()">✅ تحقق</button>
    </div>
    
    <div class="grid">
        <script>
            "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split('').forEach(l => {
                document.write(`<div class="letter" onclick="pick('${l}')">${l}</div>`);
            });
        </script>
    </div>

</body>
</html>
