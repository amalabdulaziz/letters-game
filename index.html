<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>سباق الحروف 4.1 🏆</title>
<style>
:root{--bg1:#100b2e;--bg2:#24125f;--txt:#fff;--gold:#ffd700;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:var(--txt);text-align:center;background:radial-gradient(circle at 10% 5%,rgba(255,255,255,.18),transparent 26%),linear-gradient(135deg,var(--bg1),var(--bg2));overflow-x:hidden}
button,input{font-family:inherit}
.screen{min-height:100vh;min-height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.screen.active{display:flex}
.logo{font-size:4.2rem;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
h1{font-size:2.6rem;margin:8px 0 18px;text-shadow:0 8px 22px rgba(0,0,0,.45)}
.card{width:min(560px,94vw);padding:22px;margin:10px 0;border-radius:28px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 45px rgba(0,0,0,.28);backdrop-filter:blur(12px)}
.btn{border:0;border-radius:18px;padding:15px 21px;margin:6px;font-size:1.05rem;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.25),0 16px 24px rgba(0,0,0,.2)}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.green{background:linear-gradient(135deg,#22c55e,#07893f)}.yellow{background:linear-gradient(135deg,#facc15,#f97316);color:#1f1600}.red{background:linear-gradient(135deg,#ef4444,#991b1b)}.blue{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}.purple{background:linear-gradient(135deg,#8b5cf6,#5b21b6)}.dark{background:linear-gradient(135deg,#334155,#0f172a)}
#game{justify-content:space-between;padding:0 0 8px;min-height:100vh;min-height:100dvh}
.top{width:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 10px;background:rgba(0,0,0,.18);border-bottom:1px solid rgba(255,255,255,.14)}
.player{padding:12px 8px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.player.on{outline:4px solid var(--gold);box-shadow:0 0 26px rgba(255,215,0,.6)}
.name{font-weight:900;font-size:1.05rem}.hearts{font-size:1.18rem;min-height:28px}.score{font-size:2rem;font-weight:1000}
.timer{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.1rem;font-weight:1000;background:rgba(255,255,255,.13);border:5px solid rgba(255,255,255,.25)}
.timer.danger{animation:pulse .45s infinite}@keyframes pulse{50%{transform:scale(1.08);color:#ff5555}}
.badges{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:7px 0 3px}.badge{padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);font-weight:900}
#msg{width:min(1040px,97vw);min-height:64px;margin:7px auto 7px;padding:15px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:1.22rem;font-weight:900}
.answerBox{width:min(1040px,97vw);display:flex;gap:10px;padding:0 8px}
#answer{flex:1;padding:19px;border-radius:24px;border:2px solid rgba(255,255,255,.25);outline:0;text-align:center;font-size:1.45rem;font-weight:900;background:rgba(255,255,255,.95);color:#222}
#answer:disabled{opacity:.55}
.grid{width:min(1040px,99vw);display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:8px auto 6px;padding:8px}
.letter{min-height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.94);color:#222;font-size:1.75rem;font-weight:1000;cursor:pointer;border:4px solid transparent;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.letter.used{opacity:.17;pointer-events:none}.letter.lock{opacity:.48;pointer-events:none}.letter.golden{border-color:var(--gold);background:linear-gradient(135deg,#fff7b0,#ffc400);box-shadow:0 0 24px rgba(255,215,0,.7)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-130px);z-index:50;padding:13px 18px;border-radius:999px;background:#111827;color:white;font-weight:900;transition:.25s;box-shadow:0 12px 25px rgba(0,0,0,.35)}
#toast.show{transform:translateX(-50%) translateY(0)}
.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(6px)}}
.fire{position:absolute;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;width:8px;height:8px;border-radius:50%;animation:boom 1.1s linear forwards}@keyframes boom{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@media(max-width:700px){h1{font-size:2.05rem}.top{grid-template-columns:1fr 76px 1fr}.timer{width:72px;height:72px;font-size:2.05rem}.player{padding:8px 5px}.name{font-size:.9rem}.hearts{font-size:.95rem;min-height:20px}.score{font-size:1.55rem}.badges{margin:5px 0 2px}.badge{font-size:.82rem;padding:6px 9px}.grid{grid-template-columns:repeat(6,1fr);gap:7px;margin:7px auto 4px;padding:7px;width:99vw}.letter{min-height:54px;font-size:1.28rem;border-radius:15px}#msg{font-size:.95rem;min-height:54px;margin:5px auto;padding:10px}#answer{font-size:1.05rem;padding:14px}.btn{font-size:.9rem;padding:10px 12px;margin:3px}}

@media(min-width:701px) and (max-height:900px){
  .top{padding:8px 10px}
  .timer{width:90px;height:90px;font-size:2.6rem}
  .player{padding:9px 7px}
  .hearts{min-height:22px}
  .score{font-size:1.75rem}
  .badge{padding:7px 11px}
  #msg{min-height:58px;margin:6px auto;padding:12px}
  #answer{padding:16px}
  .grid{margin:6px auto 4px;gap:9px}
  .letter{min-height:62px;font-size:1.55rem}
}
@media(min-width:900px){
  .grid{width:min(1120px,98vw)}
  .answerBox,#msg{width:min(1120px,96vw)}
}

<body>
<div id="toast"></div>

<section id="menu" class="screen active">
  <div class="logo">🏆</div>
  <h1>سباق الحروف 4.1</h1>
  <div class="card">
    <h2>👤 ضد الكمبيوتر</h2>
    <button class="btn green" onclick="startGame('ai','easy')">سهل 🟢</button>
    <button class="btn yellow" onclick="startGame('ai','normal')">متوسط 🟡</button>
    <button class="btn red" onclick="startGame('ai','hard')">صعب 🔴</button>
  </div>
  <div class="card">
    <h2>👥 على نفس الجهاز</h2>
    <button class="btn blue" onclick="startGame('local2','normal')">لاعبان</button>
    <button class="btn purple" onclick="startGame('local3','normal')">ثلاثة لاعبين</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="top">
    <div id="p1Card" class="player"><div class="name">اللاعب 1</div><div id="p1H" class="hearts">❤️❤️❤️</div><div id="p1S" class="score">0</div></div>
    <div id="timer" class="timer">15</div>
    <div id="p2Card" class="player"><div id="p2Name" class="name">الكمبيوتر</div><div id="p2H" class="hearts">❤️❤️❤️</div><div id="p2S" class="score">0</div></div>
  </div>
  <div id="p3Area" style="display:none;width:100%;padding:8px 10px;background:rgba(0,0,0,.12)">
    <div id="p3Card" class="player" style="width:min(300px,90vw);margin:auto"><div class="name">اللاعب 3</div><div id="p3H" class="hearts">❤️❤️❤️</div><div id="p3S" class="score">0</div></div>
  </div>
  <div class="badges"><span id="roundBadge" class="badge">الجولة 1</span><span id="goldBadge" class="badge">💎 الذهبي: ؟</span><span id="comboBadge" class="badge">🔥 كومبو: 0</span></div>
  <div id="msg">اختر حرفاً</div>
  <div class="answerBox"><input id="answer" placeholder="اكتب الإجابة هنا..." disabled autocomplete="off"><button class="btn green" onclick="submitAnswer()">✅</button></div>
  <div id="letters" class="grid"></div>
  <button class="btn dark" style="padding:10px 14px;font-size:.9rem;margin:3px" onclick="backMenu()">🔄 خروج للقائمة</button>
</section>

<section id="end" class="screen">
  <div class="fire" id="fire"></div>
  <div class="logo">👑</div>
  <h1 id="winnerText">الفائز</h1>
  <div class="card"><h2 id="finalScore"></h2><button class="btn green" onclick="restart()">إعادة اللعب</button><button class="btn dark" onclick="backMenu()">القائمة</button></div>
</section>

<script>
const letters="أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split("");
const dictionary={

let state={},timerId=null,audio=null;
function beep(f=700,t="sine",d=.12,v=.08){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
function toast(t){let el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1600)}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function norm(s){return(s||"").trim().replace(/[إأآا]/g,"أ").replace(/ة/g,"ه").replace(/[ىي]/g,"ي")}
function pName(p){return p==="p1"?"اللاعب 1":p==="p2"?(state.mode==="ai"?"الكمبيوتر":"اللاعب 2"):"اللاعب 3"}
function players(){return state.count===3?["p1","p2","p3"]:["p1","p2"]}
function startGame(mode,diff){let count=mode==="local3"?3:2,time=diff==="easy"?20:diff==="hard"?8:15;state={mode,diff,count,time,turn:"p1",status:"picking",round:1,golden:rnd(letters),used:{},scores:{p1:0,p2:0,p3:0},lives:{p1:3,p2:3,p3:3},combo:{p1:0,p2:0,p3:0},currentL:"",cat:"",timer:time,msg:"اختر حرفاً"};document.getElementById("p2Name").textContent=mode==="ai"?"الكمبيوتر":"اللاعب 2";document.getElementById("p3Area").style.display=count===3?"block":"none";buildLetters();show("game");render()}
function buildLetters(){let box=document.getElementById("letters");box.innerHTML="";letters.forEach(l=>{let d=document.createElement("div");d.className="letter";d.textContent=l;d.dataset.l=l;d.onclick=()=>pick(l);box.appendChild(d)})}
function render(){["p1","p2","p3"].forEach(p=>{document.getElementById(p+"S").textContent=state.scores[p]||0;document.getElementById(p+"H").textContent="❤️".repeat(Math.max(0,state.lives[p]||0))||"💔";let c=document.getElementById(p+"Card");if(c)c.classList.toggle("on",state.turn===p)});let tim=document.getElementById("timer");tim.textContent=state.timer;tim.classList.toggle("danger",state.timer<=5&&state.status==="answering");document.getElementById("roundBadge").textContent="الجولة "+state.round+(state.time===6?" ⚡":"");document.getElementById("goldBadge").textContent="💎 الذهبي: "+state.golden;document.getElementById("comboBadge").textContent="🔥 كومبو: "+(state.combo[state.turn]||0);document.getElementById("msg").textContent=state.msg;let ans=document.getElementById("answer");ans.disabled=state.status!=="answering"||(state.mode==="ai"&&state.turn==="p2");if(state.status==="picking")ans.value="";document.querySelectorAll(".letter").forEach(el=>{let l=el.dataset.l;el.className="letter";if(state.used[l])el.classList.add("used");if(l===state.golden)el.classList.add("golden");if(state.status!=="picking"||(state.mode==="ai"&&state.turn==="p2"))el.classList.add("lock")})}
function pick(l){if(state.status!=="picking"||state.used[l])return;beep(620,"triangle");state.currentL=l;state.used[l]=true;state.cat=rnd(Object.keys(dictionary));state.status="answering";state.timer=state.time;state.msg=pName(state.turn)+" | "+state.cat+" بحرف ("+l+")";render();startTimer();if(state.mode==="ai"&&state.turn==="p2")aiAnswer()}
function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(state.status!=="answering"){clearInterval(timerId);return}state.timer--;if(state.timer<=3&&state.timer>0)beep(1200,"sine",.1,.18);if(state.timer<=0){clearInterval(timerId);lose(state.turn,"⏰ انتهى الوقت!");nextTurn()}render()},1000)}
function submitAnswer(){if(state.status!=="answering")return;let v=document.getElementById("answer").value.trim();if(v)check(v,state.turn,false)}
function check(v,p,isAI){clearInterval(timerId);let words=dictionary[state.cat]?.[state.currentL]||[],ok=isAI||(norm(v)[0]===norm(state.currentL)[0]&&words.some(w=>norm(w)===norm(v)));if(ok){let pts=state.currentL===state.golden?2:1;state.combo[p]=(state.combo[p]||0)+1;if(state.combo[p]%3===0){pts++;toast("🔥 كومبو! نقطة إضافية")}state.scores[p]=(state.scores[p]||0)+pts;beep(980);if(state.currentL===state.golden)toast("💎 حرف ذهبي +2");state.msg=(isAI?"🤖 الكمبيوتر أجاب: ":"✅ إجابة صحيحة: ")+v}else{state.combo[p]=0;lose(p,"❌ إجابة غير صحيحة أو غير موجودة في القاموس");document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),260)}document.getElementById("answer").value="";if(gameOver())return;nextTurn()}
function lose(p,msg){state.lives[p]=Math.max(0,(state.lives[p]||0)-1);beep(160,"sawtooth",.25,.12);state.msg=msg;toast(msg)}
function nextTurn(){let ps=players(),i=ps.indexOf(state.turn);state.turn=ps[(i+1)%ps.length];state.status="picking";state.currentL="";state.cat="";state.round++;state.time=state.round%7===0?6:(state.diff==="easy"?20:state.diff==="hard"?8:15);if(state.time===6)toast("⚡ جولة البرق!");state.timer=state.time;state.msg=pName(state.turn)+" اختر حرفاً";if(letters.every(l=>state.used[l])){state.used={};state.golden=rnd(letters);toast("لوحة جديدة")}render();if(state.mode==="ai"&&state.turn==="p2")setTimeout(aiPick,650)}
function aiPick(){if(state.status!=="picking"||state.turn!=="p2")return;let avail=letters.filter(l=>!state.used[l]);let l=(state.diff==="hard"&&!state.used[state.golden])?state.golden:rnd(avail);pick(l)}
function aiAnswer(){let delay=state.diff==="easy"?1800:state.diff==="hard"?600:1100;setTimeout(()=>{if(state.turn!=="p2"||state.status!=="answering")return;let words=dictionary[state.cat]?.[state.currentL]||[],ans=words.length?rnd(words):state.currentL+"ـكلمة";if(state.diff==="easy"&&Math.random()<.22){lose("p2","🤖 الكمبيوتر أخطأ");if(gameOver())return;nextTurn();return}check(ans,"p2",true)},delay)}
function gameOver(){let alive=players().filter(p=>(state.lives[p]||0)>0);if(alive.length<=1){end(alive[0]||players().sort((a,b)=>state.scores[b]-state.scores[a])[0]);return true}return false}
function end(w){clearInterval(timerId);show("end");document.getElementById("winnerText").textContent="👑 الفائز: "+pName(w);document.getElementById("finalScore").textContent="P1: "+state.scores.p1+" | P2: "+state.scores.p2+(state.count===3?" | P3: "+state.scores.p3:"");fireworks()}
function fireworks(){let box=document.getElementById("fire");box.innerHTML="";for(let i=0;i<90;i++){let s=document.createElement("div");s.className="spark";s.style.left=(20+Math.random()*60)+"%";s.style.top=(20+Math.random()*50)+"%";s.style.background=["#ffd700","#22c55e","#3b82f6","#ef4444","#fff","#f97316"][Math.floor(Math.random()*6)];s.style.setProperty("--x",(Math.random()*400-200)+"px");s.style.setProperty("--y",(Math.random()*400-200)+"px");s.style.animationDelay=(Math.random()*.55)+"s";box.appendChild(s)}}
function restart(){startGame(state.mode||"ai",state.diff||"normal")}
function backMenu(){clearInterval(timerId);show("menu")}
document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter")submitAnswer()});
</script>
