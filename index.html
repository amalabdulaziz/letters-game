<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سباق الحروف 🏆</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#fff;
    font-family:sans-serif;
    text-align:center;
    color:#333;
    height:100vh;
    overflow:hidden;

    display:flex;
    flex-direction:column;
}

.score-bar{
    display:flex;
    justify-content:space-around;
    align-items:center;

    padding:15px;

    border-bottom:2px solid #f5f5f5;
}

.hearts{
    color:#e74c3c;
    display:block;
    height:25px;
}

#timer{
    font-size:3rem;
    font-weight:bold;
}

#msg{
    margin:10px 0;
}

.ans-container{
    display:flex;
    gap:10px;
    padding:15px;
}

.ans-box{
    flex-grow:1;

    padding:15px;

    border-radius:15px;
    border:2px solid #eee;

    font-size:1.2rem;
    text-align:center;
}

.btn{
    padding:12px 20px;

    border:none;
    border-radius:12px;

    cursor:pointer;
    font-weight:bold;

    transition:0.2s;
}

.btn:hover{
    transform:scale(1.05);
}

.btn-green{
    background:#2ecc71;
    color:white;
}

.grid{
    flex-grow:1;

    display:grid;
    grid-template-columns:repeat(7,1fr);

    gap:10px;

    padding:15px;
}

.letter{
    background:white;

    border:2px solid #f5f5f5;
    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:1.5rem;
    font-weight:bold;

    transition:0.2s;
}

.letter:hover{
    transform:scale(1.08);
}

.used{
    opacity:0.1;
    pointer-events:none;
    transform:scale(0.7);
}

.golden-mode{
    border:3px solid gold !important;
    background:#fff8dc !important;
    color:#b8860b !important;

    box-shadow:0 0 15px rgba(255,215,0,0.5);
}

#winnerScreen{
    position:fixed;
    inset:0;

    background:rgba(255,255,255,0.95);

    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    z-index:9999;
}

/* اهتزاز الخطأ */

@keyframes shake {

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-8px);
    }

    50%{
        transform:translateX(8px);
    }

    75%{
        transform:translateX(-8px);
    }

    100%{
        transform:translateX(0);
    }
}

.shake{
    animation:shake 0.35s;
}

</style>
</head>

<body>

<div id="winnerScreen">

    <h1 id="winnerText"></h1>

    <button class="btn btn-green" onclick="location.reload()">
        🔄 لعب مرة أخرى
    </button>

</div>

<div class="score-bar">

    <div>
        اللاعب
        <span class="hearts" id="hearts">
            ❤️❤️❤️
        </span>

        <b id="score">0</b>
    </div>

    <div id="timer">15</div>

</div>

<h2 id="msg">
    اختر حرفاً
</h2>

<div class="ans-container">

    <input
        type="text"
        id="ansInput"
        class="ans-box"
        placeholder="اكتب الإجابة..."
        autocomplete="off"
    >

    <button
        class="btn btn-green"
        onclick="submitAns()"
    >
        ✅
    </button>

</div>

<div class="grid" id="lettersGrid"></div>

<script>

const chars =
"أبتثجحخدذرزسشصضطظعغفقكلمنهوي";

const dictionary = {

"حيوان 🦁":[
"أسد","أرنب","بطة","بقر","تمساح",
"جمل","حصان","خروف","دجاج",
"فيل","قرد","كلب","نمر","قطة"
],

"بلاد 🌍":[
"ألمانيا","أردن","بحرين","تونس",
"تركيا","جزائر","سعودية","سوريا",
"عراق","عمان","فرنسا","فلسطين",
"قطر","كويت","لبنان","مصر",
"مغرب","يمن"
],

"جماد 🚗":[
"باب","بيت","تلفاز","ثلاجة",
"حقيبة","خزانة","دفتر","سيارة",
"طاولة","قلم","كتاب","هاتف","كرسي"
],

"أكلة 🍎":[
"أرز","بيتزا","برغر","تمر",
"تفاح","جبن","خبز","شوربة",
"عسل","عنب","كباب","لحم","موز"
]

};

let currentLetter = "";
let currentCategory = "";

let timer = 15;

let score = 0;
let hearts = 3;

let usedLetters = {};
let usedAnswers = {};

let audioCtx = null;

function pS(f, t='sine', d=0.2, v=0.1){

    if(!audioCtx){
        audioCtx =
        new(window.AudioContext ||
        window.webkitAudioContext)();
    }

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.type = t;
    o.frequency.value = f;

    g.gain.setValueAtTime(
        v,
        audioCtx.currentTime
    );

    g.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + d
    );

    o.connect(g);

    g.connect(audioCtx.destination);

    o.start();

    o.stop(audioCtx.currentTime + d);
}

const goldenLetter =
chars[Math.floor(Math.random()*chars.length)];

chars.split('').forEach(l => {

    const div =
    document.createElement("div");

    div.className = "letter";

    if(l === goldenLetter){
        div.classList.add("golden-mode");
    }

    div.innerText = l;

    div.onclick = () => pickLetter(l);

    document
    .getElementById("lettersGrid")
    .appendChild(div);

});

function pickLetter(letter){

    if(usedLetters[letter]) return;

    pS(700,'triangle',0.1);

    currentLetter = letter;

    usedLetters[letter] = true;

    document
    .querySelectorAll(".letter")
    .forEach(el => {

        if(el.innerText === letter){
            el.classList.add("used");
        }

    });

    const cats =
    Object.keys(dictionary);

    currentCategory =
    cats[Math.floor(Math.random()*cats.length)];

    document.getElementById("msg").innerText =
    currentCategory +
    " بحرف (" + currentLetter + ")";

    timer = 15;

    document.getElementById("timer").innerText =
    timer;
}

function submitAns(){

    const input =
    document.getElementById("ansInput");

    const val =
    input.value.trim();

    if(!val) return;

    if(usedAnswers[val]){

        alert("تم استخدام الكلمة مسبقاً");

        return;
    }

    const correctLetter =
    val.startsWith(currentLetter);

    const correctWord =
    (dictionary[currentCategory] || [])
    .includes(val);

    if(correctLetter && correctWord){

        pS(1000,'sine',0.2);

        usedAnswers[val] = true;

        const pts =
        currentLetter === goldenLetter
        ? 2
        : 1;

        score += pts;

        document.getElementById("score").innerText =
        score;

        input.value = "";

        currentLetter = "";

        document.getElementById("msg").innerText =
        "✅ إجابة صحيحة! اختر حرفاً جديداً";

    } else {

        // اهتزاز

        input.classList.remove("shake");

        void input.offsetWidth;

        input.classList.add("shake");

        setTimeout(() => {

            input.classList.remove("shake");

        },350);

        // صوت خطأ

        pS(150,'sawtooth',0.5);

    }
}

setInterval(() => {

    if(currentLetter){

        timer--;

        document.getElementById("timer").innerText =
        timer;

        // صوت آخر 3 ثواني

        if(timer <= 3 && timer > 0){

            pS(1400,'sine',0.05,0.15);

        }

        // انتهاء الوقت

        if(timer <= 0){

            hearts--;

            pS(120,'sawtooth',0.5);

            document.getElementById("hearts").innerText =
            "❤️".repeat(hearts);

            currentLetter = "";

            timer = 15;

            document.getElementById("msg").innerText =
            "⏰ انتهى الوقت! اختر حرفاً جديداً";

            // خسارة

            if(hearts <= 0){

                document.getElementById("winnerScreen").style.display =
                "flex";

                document.getElementById("winnerText").innerText =
                "😢 انتهت اللعبة";

                pS(100,'triangle',1);

            }

        }

    }

},1000);

</script>

</body>
</html>
