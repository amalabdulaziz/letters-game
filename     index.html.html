<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>سباق الحروف 2.0 🏆</title>
<style>
:root{
  --bg1:#0f1028;
  --bg2:#20124d;
  --card:rgba(255,255,255,.12);
  --card2:rgba(255,255,255,.18);
  --text:#fff;
  --muted:rgba(255,255,255,.75);
  --green:#2ecc71;
  --blue:#3498db;
  --red:#e74c3c;
  --yellow:#f1c40f;
  --purple:#9b59b6;
  --orange:#ff8a00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  text-align:center;
  background:
    radial-gradient(circle at top left,rgba(255,255,255,.18),transparent 28%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}
button,input{font-family:inherit}
.screen{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.screen.active{display:flex}
h1{
  margin:0 0 16px;
  font-size:2.35rem;
  text-shadow:0 8px 22px rgba(0,0,0,.35);
}
.logo{
  font-size:4rem;
  animation:float 2.2s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.card{
  width:min(460px,94vw);
  background:var(--card);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
  border-radius:26px;
  padding:18px;
  margin:10px 0;
}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{
  border:0;
  border-radius:16px;
  padding:13px 18px;
  margin:5px;
  font-weight:900;
  font-size:1rem;
  color:#fff;
  cursor:pointer;
  box-shadow:0 8px 0 rgba(0,0,0,.25),0 15px 25px rgba(0,0,0,.22);
  transition:.12s;
}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.green{background:linear-gradient(135deg,#2ecc71,#0aae5c)}
.blue{background:linear-gradient(135deg,#3498db,#1167b1)}
.red{background:linear-gradient(135deg,#e74c3c,#b72418)}
.yellow{background:linear-gradient(135deg,#f1c40f,#ff8a00);color:#1d1600}
.purple{background:linear-gradient(135deg,#9b59b6,#673ab7)}
.dark{background:linear-gradient(135deg,#34495e,#111827)}
.small{font-size:.85rem;padding:9px 13px;border-radius:12px}
#game{
  justify-content:flex-start;
  padding:0;
}
.top{
  width:100%;
  padding:12px 10px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;
  align-items:center;
  background:rgba(0,0,0,.18);
  border-bottom:1px solid rgba(255,255,255,.14);
}
.player{
  background:rgba(255,255,255,.1);
  border-radius:18px;
  padding:9px 7px;
  border:1px solid rgba(255,255,255,.12);
}
.player.activeTurn{
  outline:3px solid var(--yellow);
  box-shadow:0 0 22px rgba(241,196,15,.55);
}
.name{font-weight:900;font-size:.95rem}
.hearts{font-size:1rem;min-height:22px}
.score{font-size:1.7rem;font-weight:900}
.timerBox{
  min-width:92px;
  height:92px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.13);
  border:4px solid rgba(255,255,255,.22);
  box-shadow:0 0 35px rgba(255,255,255,.08);
}
#timer{font-size:2.8rem;font-weight:1000}
.timerDanger{animation:pulse .45s infinite}
@keyframes pulse{50%{transform:scale(1.08);color:#ff4d4d}}
.status{
  width:min(760px,94vw);
  margin:12px auto 8px;
  padding:13px;
  border-radius:20px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.13);
  font-weight:900;
  min-height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.answerBox{
  width:min(720px,94vw);
  display:flex;
  gap:8px;
  padding:0 8px;
}
#answer{
  flex:1;
  padding:15px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,.25);
  outline:0;
  text-align:center;
  font-size:1.15rem;
  font-weight:900;
  background:rgba(255,255,255,.95);
  color:#222;
}
#answer:disabled{opacity:.55}
.grid{
  width:min(820px,96vw);
  margin:14px auto 8px;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:9px;
  overflow:auto;
}
.letter{
  min-height:54px;
  border-radius:18px;
  background:rgba(255,255,255,.92);
  color:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.35rem;
  font-weight:1000;
  cursor:pointer;
  border:3px solid transparent;
  box-shadow:0 8px 18px rgba(0,0,0,.18);
}
.letter.used{
  opacity:.16;
  pointer-events:none;
}
.letter.golden{
  border-color:#ffd700;
  background:linear-gradient(135deg,#fff8c7,#ffc400);
  box-shadow:0 0 20px rgba(255,215,0,.65);
}
.letter.disabled{
  pointer-events:none;
  opacity:.5;
}
.badgeLine{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin:4px 0 2px;
}
.badge{
  padding:7px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.18);
  font-weight:900;
  font-size:.85rem;
}
#toast{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%) translateY(-120px);
  background:#111827;
  color:white;
  padding:12px 18px;
  border-radius:999px;
  font-weight:900;
  z-index:99;
  transition:.25s;
  box-shadow:0 12px 25px rgba(0,0,0,.35);
}
#toast.show{transform:translateX(-50%) translateY(0)}
.winTitle{font-size:2.2rem;margin:8px}
.fire{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.spark{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ffd700;
  animation:boom 1.1s linear forwards;
}
@keyframes boom{
  to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}
}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(6px)}}
@media(max-width:600px){
  h1{font-size:2rem}
  .top{grid-template-columns:1fr 82px 1fr}
  .timerBox{width:76px;height:76px;min-width:76px}
  #timer{font-size:2.25rem}
  .grid{grid-template-columns:repeat(6,1fr);gap:7px}
  .letter{min-height:47px;font-size:1.2rem;border-radius:15px}
  .status{font-size:.95rem}
  .btn{font-size:.92rem;padding:12px 14px}
}
</style>
</head>
<body>

<div id="toast"></div>

<section id="menu" class="screen active">
  <div class="logo">🏆</div>
  <h1>سباق الحروف 2.0</h1>
  <div class="card">
    <h2>👤 ضد الكمبيوتر</h2>
    <button class="btn green" onclick="startGame('ai','easy')">سهل 🟢</button>
    <button class="btn yellow" onclick="startGame('ai','normal')">متوسط 🟡</button>
    <button class="btn red" onclick="startGame('ai','hard')">صعب 🔴</button>
  </div>
  <div class="card">
    <h2>👥 على نفس الجهاز</h2>
    <button class="btn blue" onclick="startGame('local2','normal')">لاعبان 2</button>
    <button class="btn purple" onclick="startGame('local3','normal')">ثلاثة لاعبين 3</button>
  </div>
  <div class="badgeLine">
    <span class="badge">💎 حرف ذهبي</span>
    <span class="badge">🔥 كومبو</span>
    <span class="badge">⚡ جولة برق</span>
  </div>
</section>

<section id="game" class="screen">
  <div class="top">
    <div id="p1Card" class="player">
      <div class="name">اللاعب 1</div>
      <div id="p1H" class="hearts">❤️❤️❤️</div>
      <div id="p1S" class="score">0</div>
    </div>
    <div id="timerWrap" class="timerBox"><div id="timer">15</div></div>
    <div id="p2Card" class="player">
      <div class="name" id="p2Name">الكمبيوتر</div>
      <div id="p2H" class="hearts">❤️❤️❤️</div>
      <div id="p2S" class="score">0</div>
    </div>
  </div>

  <div id="p3Area" style="display:none;width:100%;padding:8px 10px;background:rgba(0,0,0,.12)">
    <div id="p3Card" class="player" style="width:min(260px,90vw);margin:auto">
      <div class="name">اللاعب 3</div>
      <div id="p3H" class="hearts">❤️❤️❤️</div>
      <div id="p3S" class="score">0</div>
    </div>
  </div>

  <div class="badgeLine">
    <span class="badge" id="roundBadge">الجولة 1</span>
    <span class="badge" id="goldBadge">💎 الذهبي: ؟</span>
    <span class="badge" id="comboBadge">🔥 كومبو: 0</span>
  </div>

  <div id="msg" class="status">اختر حرفاً</div>

  <div class="answerBox">
    <input id="answer" placeholder="اكتب الإجابة هنا..." disabled autocomplete="off" />
    <button class="btn green" onclick="submitAnswer()">✅</button>
  </div>

  <div id="letters" class="grid"></div>

  <button class="btn dark small" onclick="backMenu()">🔄 خروج للقائمة</button>
</section>

<section id="end" class="screen">
  <div class="fire" id="fire"></div>
  <div class="logo">👑</div>
  <h1 class="winTitle" id="winnerText">الفائز</h1>
  <div class="card">
    <h2 id="finalScore">النتيجة</h2>
    <button class="btn green" onclick="restart()">إعادة اللعب</button>
    <button class="btn dark" onclick="backMenu()">القائمة الرئيسية</button>
  </div>
</section>

<script>
const letters = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split("");

const dictionary = {
  "حيوان 🦁": {
    "أ":["أسد","أرنب","أفعى","إوزة"],"ب":["بقرة","ببر","بطة"],"ت":["تمساح","تيس"],"ث":["ثعلب"],"ج":["جمل","جراد"],"ح":["حصان","حمار","حمامة"],"خ":["خروف"],"د":["دب","دجاجة","دلفين"],"ذ":["ذئب"],"ر":["راكون","ريم"],"ز":["زرافة","زنبور"],"س":["سمكة","سلحفاة"],"ش":["شبل","شمبانزي"],"ص":["صقر"],"ض":["ضفدع"],"ط":["طاووس"],"ظ":["ظبي"],"ع":["عصفور","عقرب"],"غ":["غزال","غراب"],"ف":["فيل","فهد"],"ق":["قرد","قط"],"ك":["كلب","كنغر"],"ل":["لقلق"],"م":["ماعز","مهر"],"ن":["نمر","نورس"],"ه":["هدهد"],"و":["وعل","وزغة"],"ي":["يمامة"]
  },
  "بلاد 🌍": {
    "أ":["ألمانيا","أستراليا","أمريكا"],"ب":["بحرين","برازيل"],"ت":["تونس","تركيا"],"ث":["ثول"],"ج":["جزائر","جدة"],"ح":["حلب","حائل"],"خ":["خرطوم"],"د":["دوحة","دبي"],"ذ":["ذمار"],"ر":["رياض","روسيا"],"ز":["زامبيا"],"س":["سعودية","سوريا"],"ش":["شارقة"],"ص":["صين","صربيا"],"ض":["ضبا"],"ط":["طائف"],"ظ":["ظهران"],"ع":["عراق","عمان"],"غ":["غزة"],"ف":["فرنسا","فلسطين"],"ق":["قطر"],"ك":["كويت","كندا"],"ل":["لبنان","لندن"],"م":["مصر","مكة"],"ن":["نمسا","نجران"],"ه":["هند"],"و":["واشنطن"],"ي":["يمن"]
  },
  "جماد 🚗": {
    "أ":["إبريق","إبرة","أريكة"],"ب":["باب","بطارية"],"ت":["تلفاز","تاج"],"ث":["ثلاجة"],"ج":["جدار","جوال"],"ح":["حقيبة","حاسوب"],"خ":["خزانة","خاتم"],"د":["دفتر","دراجة"],"ذ":["ذهب"],"ر":["راديو","رف"],"ز":["زجاج","زر"],"س":["سيارة","ساعة"],"ش":["شباك","شنطة"],"ص":["صندوق","صحن"],"ض":["ضمادة"],"ط":["طاولة","طبق"],"ظ":["ظرف"],"ع":["عصا","علبة"],"غ":["غسالة"],"ف":["فانوس","فرن"],"ق":["قلم","قارب"],"ك":["كتاب","كرسي"],"ل":["لوحة","لعبة"],"م":["مكتب","مفتاح"],"ن":["نظارة"],"ه":["هاتف"],"و":["ورقة","وسادة"],"ي":["يخت"]
  },
  "أكلة 🍔": {
    "أ":["أرز","إيدام"],"ب":["بيتزا","بسبوسة"],"ت":["تمر","تبولة"],"ث":["ثوم"],"ج":["جبن","جريش"],"ح":["حلوى","حمص"],"خ":["خوخ","خبز"],"د":["دجاج","دونات"],"ذ":["ذرة"],"ر":["رمان","رز"],"ز":["زيتون"],"س":["سمك","سلطة"],"ش":["شاورما","شوربة"],"ص":["صيادية"],"ض":["ضلوع"],"ط":["طماطم"],"ظ":["ظبي"],"ع":["عسل","عريكة"],"غ":["غريبة"],"ف":["فراولة","فطيرة"],"ق":["قشطة","قطايف"],"ك":["كباب","كيك"],"ل":["لحم","لبن"],"م":["موز","مكرونة"],"ن":["نعناع","نقانق"],"ه":["هريس"],"و":["وافل"],"ي":["يوسفي"]
  },
  "نبات 🌳": {
    "أ":["أرز","ألوفيرا"],"ب":["بقدونس","بصل"],"ت":["تفاح","تين"],"ث":["ثوم"],"ج":["جزر","جرجير"],"ح":["حبق"],"خ":["خيار","خس"],"د":["دخن"],"ذ":["ذرة"],"ر":["رمان","ريحان"],"ز":["زعتر","زيتون"],"س":["سمسم","سدر"],"ش":["شعير"],"ص":["صبار"],"ض":["ضرم"],"ط":["طماطم"],"ظ":["ظيان"],"ع":["عنب"],"غ":["غار"],"ف":["فراولة","فلفل"],"ق":["قرنفل"],"ك":["كزبرة"],"ل":["ليمون"],"م":["موز"],"ن":["نعناع"],"ه":["هيل"],"و":["ورد"],"ي":["ياسمين"]
  },
  "مهنة 💼": {
    "أ":["أستاذ","إطفائي"],"ب":["بائع"],"ت":["تاجر"],"ث":["ثري"],"ج":["جراح"],"ح":["حداد","حارس"],"خ":["خباز"],"د":["دكتور"],"ذ":["ذهّاب"],"ر":["رسام"],"ز":["زارع"],"س":["سائق"],"ش":["شرطي"],"ص":["صياد"],"ض":["ضابط"],"ط":["طبيب","طيار"],"ظ":["ظابط"],"ع":["عامل"],"غ":["غواص"],"ف":["فلاح"],"ق":["قاضي"],"ك":["كاتب"],"ل":["لاعب"],"م":["مهندس","معلم"],"ن":["نجار"],"ه":["هندسي"],"و":["وزير"],"ي":["يوتيوبر"]
  },
  "لون 🎨": {
    "أ":["أحمر","أبيض"],"ب":["بنفسجي","بني"],"ت":["تركوازي"],"ث":["ثلجي"],"ج":["جملي"],"ح":["حليبي"],"خ":["خمري"],"د":["ذهبي"],"ذ":["ذهبي"],"ر":["رمادي"],"ز":["زهري"],"س":["سماوي"],"ش":["شفاف"],"ص":["صدفي"],"ض":["ضبابي"],"ط":["طوبي"],"ظ":["ظلي"],"ع":["عنابي"],"غ":["غامق"],"ف":["فضي"],"ق":["قرمزي"],"ك":["كحلي"],"ل":["ليموني"],"م":["موف"],"ن":["نحاسي"],"ه":["هافان"],"و":["وردي"],"ي":["ياقوتي"]
  }
};

let state = {};
let timerId = null;
let audioCtx = null;

function sound(freq=700,type="sine",dur=.14,vol=.08){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function toast(t){
  const el=document.getElementById("toast");
  el.textContent=t;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1500);
}
function norm(s){
  return (s||"").trim().replace(/[إأآا]/g,"أ").replace(/ة/g,"ه").replace(/[ىي]/g,"ي");
}
function sameLetter(word,l){
  const first = norm(word)[0];
  const ll = norm(l)[0];
  return first === ll;
}
function random(arr){return arr[Math.floor(Math.random()*arr.length)]}
function startGame(mode,difficulty){
  const count = mode==="local3" ? 3 : 2;
  const time = difficulty==="easy" ? 20 : difficulty==="hard" ? 8 : 15;
  state = {
    mode,difficulty,count,time,
    turn:"p1",
    status:"picking",
    round:1,
    golden:random(letters),
    used:{},
    scores:{p1:0,p2:0,p3:0},
    lives:{p1:3,p2:3,p3:3},
    combo:{p1:0,p2:0,p3:0},
    currentL:"",
    cat:"",
    timer:time,
    lastMsg:"اختر حرفاً"
  };
  document.getElementById("p2Name").textContent = mode==="ai" ? "الكمبيوتر" : "اللاعب 2";
  document.getElementById("p3Area").style.display = count===3 ? "block":"none";
  buildLetters();
  show("game");
  render();
}
function restart(){
  startGame(state.mode || "ai", state.difficulty || "normal");
}
function backMenu(){
  clearInterval(timerId);
  timerId=null;
  show("menu");
}
function buildLetters(){
  const box=document.getElementById("letters");
  box.innerHTML="";
  letters.forEach(l=>{
    const div=document.createElement("div");
    div.className="letter";
    div.textContent=l;
    div.dataset.letter=l;
    div.onclick=()=>pickLetter(l);
    box.appendChild(div);
  });
}
function players(){
  return state.count===3 ? ["p1","p2","p3"] : ["p1","p2"];
}
function playerName(p){
  if(p==="p1") return "اللاعب 1";
  if(p==="p2") return state.mode==="ai" ? "الكمبيوتر" : "اللاعب 2";
  return "اللاعب 3";
}
function render(){
  ["p1","p2","p3"].forEach(p=>{
    document.getElementById(p+"S").textContent=state.scores[p]||0;
    document.getElementById(p+"H").textContent="❤️".repeat(Math.max(0,state.lives[p]||0)) || "💔";
    const card=document.getElementById(p+"Card");
    if(card) card.classList.toggle("activeTurn",state.turn===p);
  });
  document.getElementById("timer").textContent=state.timer;
  document.getElementById("timerWrap").classList.toggle("timerDanger",state.timer<=5 && state.status==="answering");
  document.getElementById("roundBadge").textContent="الجولة "+state.round+(state.time<=6?" ⚡":"");
  document.getElementById("goldBadge").textContent="💎 الذهبي: "+state.golden;
  document.getElementById("comboBadge").textContent="🔥 كومبو: "+(state.combo[state.turn]||0);
  document.getElementById("msg").textContent=state.lastMsg;
  const ans=document.getElementById("answer");
  ans.disabled = state.status!=="answering" || (state.mode==="ai" && state.turn==="p2");
  if(state.status==="picking") ans.value="";
  document.querySelectorAll(".letter").forEach(el=>{
    const l=el.dataset.letter;
    el.className="letter";
    if(state.used[l]) el.classList.add("used");
    if(l===state.golden) el.classList.add("golden");
    if(state.status!=="picking" || (state.mode==="ai" && state.turn==="p2")) el.classList.add("disabled");
  });
}
function pickLetter(l){
  if(state.status!=="picking" || state.used[l]) return;
  sound(620,"triangle",.12,.09);
  state.currentL=l;
  state.used[l]=true;
  state.cat=random(Object.keys(dictionary));
  state.status="answering";
  state.timer=state.time;
  state.lastMsg = playerName(state.turn)+" | "+state.cat+" بحرف ("+l+")";
  render();
  startTimer();
  if(state.mode==="ai" && state.turn==="p2") aiAnswer();
}
function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(state.status!=="answering"){clearInterval(timerId);timerId=null;return}
    state.timer--;
    if(state.timer<=3 && state.timer>0) sound(1200,"sine",.1,.18);
    if(state.timer<=0){
      clearInterval(timerId);timerId=null;
      loseLife(state.turn,"⏰ انتهى الوقت!");
      nextTurn();
    }
    render();
  },1000);
}
function submitAnswer(){
  if(state.status!=="answering") return;
  const val=document.getElementById("answer").value.trim();
  if(!val) return;
  checkAnswer(val,state.turn,false);
}
function checkAnswer(val,p,isAI){
  clearInterval(timerId); timerId=null;
  const validLetter=sameLetter(val,state.currentL);
  const words=dictionary[state.cat]?.[state.currentL] || [];
  const inDict=words.some(w=>norm(w)===norm(val));
  const accept = isAI ? true : (validLetter && val.length>1);
  if(accept){
    let pts = state.currentL===state.golden ? 2 : 1;
    state.combo[p]=(state.combo[p]||0)+1;
    if(state.combo[p]>0 && state.combo[p]%3===0){
      pts++;
      toast("🔥 كومبو! نقطة إضافية");
    }
    state.scores[p]=(state.scores[p]||0)+pts;
    sound(980,"sine",.18,.1);
    if(state.currentL===state.golden) toast("💎 حرف ذهبي! +2");
    state.lastMsg = (isAI ? "🤖 الكمبيوتر أجاب: " : "✅ إجابة صحيحة: ") + val;
  }else{
    state.combo[p]=0;
    loseLife(p,"❌ لازم تبدأ الإجابة بحرف ("+state.currentL+")");
    document.body.classList.add("shake");
    setTimeout(()=>document.body.classList.remove("shake"),260);
  }
  document.getElementById("answer").value="";
  if(checkGameOver()) return;
  nextTurn();
}
function loseLife(p,msg){
  state.lives[p]=Math.max(0,(state.lives[p]||0)-1);
  sound(160,"sawtooth",.28,.12);
  state.lastMsg=msg;
  toast(msg);
}
function nextTurn(){
  const ps=players();
  const idx=ps.indexOf(state.turn);
  state.turn=ps[(idx+1)%ps.length];
  state.status="picking";
  state.currentL="";
  state.cat="";
  state.round++;
  if(state.round%7===0){
    state.time=6;
    toast("⚡ جولة البرق!");
  }else{
    state.time = state.difficulty==="easy" ? 20 : state.difficulty==="hard" ? 8 : 15;
  }
  state.timer=state.time;
  state.lastMsg= playerName(state.turn)+" اختر حرفاً";
  render();
  if(allLettersUsed()){
    state.used={};
    state.golden=random(letters);
    toast("🔄 انتهت الحروف وبدأت لوحة جديدة");
  }
  if(state.mode==="ai" && state.turn==="p2"){
    setTimeout(aiPick,700);
  }
}
function aiPick(){
  if(state.status!=="picking" || state.turn!=="p2") return;
  const avail=letters.filter(l=>!state.used[l]);
  if(!avail.length){state.used={}; return aiPick();}
  let l=random(avail);
  if(state.difficulty==="hard" && !state.used[state.golden]) l=state.golden;
  pickLetter(l);
}
function aiAnswer(){
  const delay = state.difficulty==="easy" ? 1800 : state.difficulty==="hard" ? 550 : 1100;
  setTimeout(()=>{
    if(state.turn!=="p2" || state.status!=="answering") return;
    const words=dictionary[state.cat]?.[state.currentL] || [];
    let ans = words.length ? random(words) : state.currentL+"ـكلمة";
    if(state.difficulty==="easy" && Math.random()<.22) {
      loseLife("p2","🤖 الكمبيوتر أخطأ!");
      if(checkGameOver()) return;
      nextTurn();
      return;
    }
    checkAnswer(ans,"p2",true);
  },delay);
}
function allLettersUsed(){
  return letters.every(l=>state.used[l]);
}
function checkGameOver(){
  const alive=players().filter(p=>(state.lives[p]||0)>0);
  if(alive.length<=1){
    endGame(alive[0] || winnerByScore());
    return true;
  }
  return false;
}
function winnerByScore(){
  return players().sort((a,b)=>(state.scores[b]||0)-(state.scores[a]||0))[0];
}
function endGame(winner){
  clearInterval(timerId); timerId=null;
  show("end");
  document.getElementById("winnerText").textContent="👑 الفائز: "+playerName(winner);
  document.getElementById("finalScore").textContent =
    "P1: "+state.scores.p1+" | P2: "+state.scores.p2+(state.count===3?" | P3: "+state.scores.p3:"");
  fireworks();
}
function fireworks(){
  const box=document.getElementById("fire");
  box.innerHTML="";
  for(let i=0;i<90;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.style.left=(20+Math.random()*60)+"%";
    s.style.top=(20+Math.random()*50)+"%";
    s.style.background=["#ffd700","#2ecc71","#3498db","#e74c3c","#ffffff","#ff8a00"][Math.floor(Math.random()*6)];
    s.style.setProperty("--x",(Math.random()*400-200)+"px");
    s.style.setProperty("--y",(Math.random()*400-200)+"px");
    s.style.animationDelay=(Math.random()*.55)+"s";
    box.appendChild(s);
  }
}
document.getElementById("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter") submitAnswer();
});
</script>
</body>
</html>
